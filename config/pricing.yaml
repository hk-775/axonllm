      prompt_token_cost: 0.0015
      completion_token_cost: 0.009
    # Above 200k input tokens this rises to $4/$18 per MTok. The sub-threshold
    # rate is used; see the header note on context tiers.
    gemini-3.1-pro-preview:
      prompt_token_cost: 0.002
      completion_token_cost: 0.012
    # gemini-3-pro-preview is off the price list but *not* retired: it is still
    # served, and still listed by GET /v1beta/models with generateContent
    # support. So it is a working model Google no longer publishes a rate for,
    # which is the one case nothing can fix — the id is right, and there is no
    # number to put here. Left unpriced rather than filled from 3.1 Pro Preview:
    # a preview model's rate is not inheritable from its successor, and this is
    # exactly the case the drift report should keep raising.

