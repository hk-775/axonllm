      completion_token_cost: 0.0025
      cached_token_cost: 0.0002
    grok-4.5:
      prompt_token_cost: 0.002
      completion_token_cost: 0.006
      cached_token_cost: 0.0003

  # Rates from the `pricing` block on each model in Together's GET /v1/models,
  # in USD per 1M tokens. Only serverless-servable ids are listed — see the note
  # in models.yaml on why the rest cannot be used regardless of price.
  together:
    meta-llama/Llama-3.3-70B-Instruct-Turbo:
