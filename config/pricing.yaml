      completion_token_cost: 0.004
      cached_token_cost: 0.00008
      cache_creation_token_cost: 0.001
    claude-opus-4-20250514:
      prompt_token_cost: 0.015
      completion_token_cost: 0.075
      cached_token_cost: 0.0015
      cache_creation_token_cost: 0.01875
    # Opus 4.5 and later are $5/$25 per MTok — a third of Opus 4.1 and earlier.
    # This entry read 0.015/0.075, the retired Opus 4.1 rate, so every request
    # to Opus 4.8 was billed at 3x. Wrong in the opposite direction to an
    # unpriced model, and invisible for the same reason: nothing cross-checks a
    # rate that parses.
    claude-opus-4-8:
      prompt_token_cost: 0.005
      completion_token_cost: 0.025
      cached_token_cost: 0.0005
      cache_creation_token_cost: 0.00625
    claude-haiku-4-5-20251001:
