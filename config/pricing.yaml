  # Mantle SKUs are published separately in the Price List
  # (…-mantle-input-tokens-standard) but priced identically to the corresponding
  # on-demand Bedrock SKU: of the 66 model/direction pairs where us-east-1 lists
  # both, all 66 agree to the cent. So a Mantle rate is the Bedrock rate, and
  # the overlap below is expected rather than duplication to collapse — these
  # are separate lookup keys because the provider name differs.
  bedrock-mantle:
    anthropic.claude-haiku-4-5:
      prompt_token_cost: 0.0011
      completion_token_cost: 0.0055
      cached_token_cost: 0.00011
      cache_creation_token_cost: 0.001375
    anthropic.claude-sonnet-5:
      prompt_token_cost: 0.0022
      completion_token_cost: 0.011
      cached_token_cost: 0.00022
      cache_creation_token_cost: 0.00275
    anthropic.claude-opus-4-8:
      prompt_token_cost: 0.0055
      completion_token_cost: 0.0275
      cached_token_cost: 0.00055
      cache_creation_token_cost: 0.006875
    deepseek.v3.1:
      prompt_token_cost: 0.00058
      completion_token_cost: 0.00168
    qwen.qwen3-32b:
      prompt_token_cost: 0.00015
      completion_token_cost: 0.0006
    openai.gpt-oss-120b:
      prompt_token_cost: 0.00015
      completion_token_cost: 0.0006
    # openai.gpt-5.4, -5.6-luna and -5.6-terra appear in the Price List only in
    # us-gov-east-1 / us-gov-west-1, at rates carrying the GovCloud premium.
    # openai.gpt-5.5 and openai.gpt-5.6-sol are absent in every region. Left
    # unpriced rather than filled from GovCloud or inferred from a sibling:
    # /admin/pricing-drift keeps them visible, and a wrong rate would not be.

