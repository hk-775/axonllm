      completion_token_cost: 0.00025
    openai/gpt-oss-120b:
      prompt_token_cost: 0.00015
      completion_token_cost: 0.0006

  # No section for fireworks. Its two mappings could not be verified at all —
  # there is no FIREWORKS_API_KEY in the environment and the models endpoint
  # requires one (401) — and Fireworks publishes no per-model serverless price
  # table to fall back on. Guessing from another provider's rate for the same
  # open-weight model would be a fabrication with a plausible shape: gpt-oss-120b
  # is $0.15/$0.60 on both Bedrock and Together, which makes a third value look
  # inevitable rather than assumed. Left on the drift report instead.
