    prompt_tokens: 900
    completion_tokens: 450
    cost: 0.00045
  - project_id: proj-alpha
    user_id: user-bob
    provider: bedrock
    model: claude-3
    prompt_tokens: 600
    completion_tokens: 300
    cost: 0.0063
    cached_tokens: 400
    cache_creation_tokens: 100

policies:
  - name: allow-all-read
    description: Allow all users read access
    policy_text: 'permit(principal, action == Action::"read", resource);'
    mode: ENFORCE
  - name: restrict-gpt4
    description: Restrict GPT-4 to senior devs
    policy_text: 'forbid(principal, action, resource) unless { principal.role == "senior" };'
    mode: LOG_ONLY

unhealthy_providers:
  - provider: azure_openai
    cooldown_seconds: 600
