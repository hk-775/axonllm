  - project_id: proj-beta
    name: Beta Team
    budget_limit: 200.0
    alert_threshold: 150.0
    members:
      - user-carol
    allowed_models:
      - claude-haiku
      - gpt-4o-mini
      - nova-lite
      - nova-micro

user_budgets:
