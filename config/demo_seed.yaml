    budget_limit: 50.0
    alert_threshold: 40.0
  - user_id: user-bob
    budget_limit: 100.0
    alert_threshold: 80.0
  - user_id: user-carol
    budget_limit: 75.0
    alert_threshold: 60.0
  - user_id: chat-user
    budget_limit: 200.0
    alert_threshold: 150.0
  - user_id: test-user
    budget_limit: 100.0
    alert_threshold: 80.0

usage_seeds:
  - project_id: proj-alpha
    user_id: user-alice
    provider: openai
    model: gpt-4
    prompt_tokens: 500
    completion_tokens: 200
    cost: 0.033
  - project_id: proj-alpha
    user_id: user-alice
    provider: anthropic
    model: claude-3
    prompt_tokens: 300
    completion_tokens: 150
    cost: 0.0032
    cached_tokens: 200
    cache_creation_tokens: 50
  - project_id: proj-alpha
    user_id: user-alice
    provider: google_ai
    model: gemini-pro
    prompt_tokens: 400
    completion_tokens: 250
    cost: 0.000225
  - project_id: proj-alpha
    user_id: user-bob
    provider: openai
    model: gpt-4
    prompt_tokens: 800
    completion_tokens: 400
    cost: 0.054
  - project_id: proj-alpha
    user_id: user-bob
    provider: google_ai
    model: gemini-pro
    prompt_tokens: 600
    completion_tokens: 350
    cost: 0.000325
  - project_id: proj-beta
    user_id: user-carol
    provider: openai
    model: gpt-4
    prompt_tokens: 1000
    completion_tokens: 500
    cost: 0.06
  - project_id: proj-beta
    user_id: user-carol
    provider: anthropic
    model: claude-3
    prompt_tokens: 200
