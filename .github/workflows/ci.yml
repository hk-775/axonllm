name: CI

on:
  push:
    branches: [main, fresh-start]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_CACHE_DIR: /tmp/axonllm-uv-cache
  UV_VERSION: "0.10.7"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install --no-deps "uv==${UV_VERSION}"

      - name: Verify dependency locks
        run: |
          uv lock --check
          scripts/ci/check_dependency_locks.sh

      - name: Install locked test dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: >-
          uv sync --frozen --extra dev --extra agentcore
          --python "${PYTHON_VERSION}"

      - name: Lint
        run: >-
          uv run --frozen --no-sync ruff check --no-cache
          src tests agentcore_agent.py serve_dashboard.py

      - name: Run tests
        run: uv run --frozen --no-sync pytest tests -q --tb=short

  supply-chain:
    name: Supply chain and IaC
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up supported Node for CDK
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pinned uv
        run: python -m pip install --no-deps "uv==${UV_VERSION}"

      - name: Install locked audit dependencies
        run: uv sync --frozen --extra security

      - name: Validate workflow and operational tooling
        run: |
          uv run --frozen --no-sync python scripts/ci/validate_workflows.py
          uv run --frozen --no-sync python -m unittest discover -s tests/release_security -p 'test_*.py' -v
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Install checksum-verified scanners
        run: |
          scripts/ci/install_security_tools.sh "${RUNNER_TEMP}/bin"
          printf '%s\n' "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Validate GitHub Actions syntax
        run: actionlint

      - name: Scan Git history for secrets
        run: >-
          gitleaks git
          --redact
          --no-banner
          --gitleaks-ignore-path .github/gitleaksignore
          .

      - name: Audit frozen Python dependencies
        run: scripts/ci/audit_python_dependencies.sh

      - name: Scan Dockerfile configuration
        run: >-
          trivy config
          --disable-telemetry
          --skip-check-update
          --ignorefile .github/trivyignore.yaml
          --severity HIGH,CRITICAL
          --exit-code 1
          Dockerfile

      - name: Synthesize and verify CDK assets
        env:
          CDK_CI_OUTDIR: ${{ runner.temp }}/cdk.out
          JSII_RUNTIME_PACKAGE_CACHE_ROOT: ${{ runner.temp }}/jsii-cache
        run: scripts/ci/synthesize_and_verify_cdk.sh "${CDK_CI_OUTDIR}"

      - name: Scan synthesized Fargate CloudFormation
        env:
          CDK_CI_OUTDIR: ${{ runner.temp }}/cdk.out
        run: >-
          trivy config
          --disable-telemetry
          --skip-check-update
          --ignorefile .github/trivyignore.yaml
          --severity HIGH,CRITICAL
          --exit-code 1
          "${CDK_CI_OUTDIR}/fargate/AxonLLMStack.template.json"

      - name: Scan synthesized AgentCore CloudFormation
        env:
          CDK_CI_OUTDIR: ${{ runner.temp }}/cdk.out
        run: >-
          trivy config
          --disable-telemetry
          --skip-check-update
          --ignorefile .github/trivyignore.yaml
          --severity HIGH,CRITICAL
          --exit-code 1
          "${CDK_CI_OUTDIR}/agentcore/AxonLLMAgentCoreStack.template.json"

      - name: Scan synthesized release-foundation CloudFormation
        env:
          CDK_CI_OUTDIR: ${{ runner.temp }}/cdk.out
        run: >-
          trivy config
          --disable-telemetry
          --skip-check-update
          --ignorefile .github/trivyignore.yaml
          --severity HIGH,CRITICAL
          --exit-code 1
          "${CDK_CI_OUTDIR}/release-foundation/AxonLLMReleaseFoundationStack.template.json"

  container:
    name: Container build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install checksum-verified scanners
        run: |
          scripts/ci/install_security_tools.sh "${RUNNER_TEMP}/bin"
          printf '%s\n' "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Build production image
        run: >-
          docker build
          --pull
          --platform linux/amd64
          --tag axonllm-ci:verify
          .

      - name: Verify image contents and runtime constraints
        run: python scripts/ci/verify_image.py axonllm-ci:verify

      - name: Scan production image
        run: >-
          trivy image
          --disable-telemetry
          --scanners vuln,secret
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 1
          axonllm-ci:verify
