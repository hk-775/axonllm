name: CI

on:
  push:
    branches: [main, fresh-start]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uvx ruff check src/ tests/

      - name: Type check (optional)
        continue-on-error: true
        run: uvx mypy src/gateway --ignore-missing-imports --no-error-summary || true

      - name: Run tests
        run: uv run pytest tests/ -x -q --tb=short
