name: Validate production recovery and secrets

on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "30 11 1 * *"
  workflow_dispatch:
    inputs:
      require_vault_lock:
        description: Fail unless AWS Backup Vault Lock is enabled
        required: false
        default: false
        type: boolean
      exercise_restore:
        description: Run the PITR restore exercise in addition to metadata auditing
        required: false
        default: false
        type: boolean
      retain_fargate_restore:
        description: Retain and protect the Fargate restore for a controlled cutover
        required: false
        default: false
        type: boolean
      require_automatic_rotation:
        description: Fail unless Secrets Manager automatic rotation is enabled
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-operations-validation
  cancel-in-progress: false

jobs:
  audit:
    name: Audit ${{ matrix.target }} recovery metadata
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '30 10 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fargate
            stack_name: AxonLLMStack
            table_name: ${{ vars.AXON_FARGATE_STATE_TABLE_NAME || 'axonllm-state' }}
            vault_prefix: axon-state-
            kms_key_arn: ${{ vars.AXON_DATA_KMS_KEY_ARN }}
            validate_secret: true
          - target: agentcore
            stack_name: AxonLLMAgentCoreStack
            table_name: ${{ vars.AXON_AGENTCORE_STATE_TABLE_NAME || 'axonllm-agentcore-state' }}
            vault_prefix: axon-agent-
            kms_key_arn: ${{ vars.AXON_AGENTCORE_DATA_KMS_KEY_ARN }}
            validate_secret: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out operational checks
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AXON_OPERATIONS_AUDIT_ROLE_ARN }}
          role-session-name: AxonLLMOperationsValidation
          allowed-account-ids: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["backup:DescribeBackupVault","backup:ListRecoveryPointsByBackupVault"],"Resource":"arn:aws:backup:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:backup-vault:${{ matrix.vault_prefix }}*"},{"Effect":"Allow","Action":["cloudformation:DescribeStacks","cloudformation:ListStackResources"],"Resource":"arn:aws:cloudformation:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:stack/${{ matrix.stack_name }}/*"},{"Effect":"Allow","Action":["dynamodb:DescribeContinuousBackups","dynamodb:DescribeTable"],"Resource":"arn:aws:dynamodb:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:table/${{ matrix.table_name }}"},{"Effect":"Allow","Action":["secretsmanager:DescribeSecret","secretsmanager:ListSecretVersionIds"],"Resource":"arn:aws:secretsmanager:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:secret:AxonLLMStack-*"},{"Effect":"Allow","Action":["kms:DescribeKey","kms:GetKeyRotationStatus"],"Resource":"${{ matrix.kms_key_arn }}"}]}

      - name: Validate state recovery controls
        env:
          REQUIRE_VAULT_LOCK: ${{ github.event_name == 'schedule' || inputs.require_vault_lock }}
        run: |
          set -euo pipefail
          arguments=()
          if [[ "${REQUIRE_VAULT_LOCK}" == "true" ]]; then
            arguments+=(--require-vault-lock)
          fi
          python scripts/operations/validate_state_recovery.py \
            --stack-name "${{ matrix.stack_name }}" \
            "${arguments[@]}"

      - name: Validate provider-secret rotation
        if: ${{ matrix.validate_secret && !cancelled() }}
        env:
          REQUIRE_AUTOMATIC_ROTATION: ${{ inputs.require_automatic_rotation || false }}
        run: |
          set -euo pipefail
          arguments=()
          if [[ "${REQUIRE_AUTOMATIC_ROTATION}" == "true" ]]; then
            arguments+=(--require-automatic-rotation)
          fi
          python scripts/operations/check_secret_rotation.py \
            --stack-name "${{ matrix.stack_name }}" \
            "${arguments[@]}"

  recovery:
    name: Exercise ${{ matrix.target }} point-in-time recovery
    if: >-
      github.event.schedule == '30 11 1 * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.exercise_restore)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fargate
            stack_name: AxonLLMStack
            table_name: ${{ vars.AXON_FARGATE_STATE_TABLE_NAME || 'axonllm-state' }}
            vault_prefix: axon-state-
            kms_key_arn: ${{ vars.AXON_DATA_KMS_KEY_ARN }}
          - target: agentcore
            stack_name: AxonLLMAgentCoreStack
            table_name: ${{ vars.AXON_AGENTCORE_STATE_TABLE_NAME || 'axonllm-agentcore-state' }}
            vault_prefix: axon-agent-
            kms_key_arn: ${{ vars.AXON_AGENTCORE_DATA_KMS_KEY_ARN }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out recovery tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Configure recovery AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AXON_OPERATIONS_RECOVERY_ROLE_ARN }}
          role-session-name: AxonLLMRecoveryExercise
          role-duration-seconds: 7200
          allowed-account-ids: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["backup:DescribeBackupVault","backup:ListRecoveryPointsByBackupVault"],"Resource":"arn:aws:backup:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:backup-vault:${{ matrix.vault_prefix }}*"},{"Effect":"Allow","Action":["cloudformation:DescribeStacks","cloudformation:ListStackResources"],"Resource":"arn:aws:cloudformation:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:stack/${{ matrix.stack_name }}/*"},{"Effect":"Allow","Action":["dynamodb:DescribeContinuousBackups","dynamodb:DescribeTable","dynamodb:RestoreTableToPointInTime","dynamodb:Scan"],"Resource":"arn:aws:dynamodb:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:table/${{ matrix.table_name }}"},{"Effect":"Allow","Action":["dynamodb:DeleteTable","dynamodb:DescribeContinuousBackups","dynamodb:DescribeTable","dynamodb:DescribeTimeToLive","dynamodb:RestoreTableToPointInTime","dynamodb:Scan","dynamodb:UpdateContinuousBackups","dynamodb:UpdateTable","dynamodb:UpdateTimeToLive"],"Resource":"arn:aws:dynamodb:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:table/${{ matrix.table_name }}-restore-validation-*"},{"Effect":"Allow","Action":["kms:Decrypt","kms:DescribeKey","kms:Encrypt","kms:GenerateDataKey","kms:GenerateDataKeyWithoutPlaintext","kms:ReEncryptFrom","kms:ReEncryptTo"],"Resource":"${{ matrix.kms_key_arn }}","Condition":{"StringEquals":{"kms:CallerAccount":"${{ vars.AXON_AWS_ACCOUNT_ID }}","kms:ViaService":"dynamodb.us-east-1.amazonaws.com"}}},{"Effect":"Allow","Action":"kms:CreateGrant","Resource":"${{ matrix.kms_key_arn }}","Condition":{"Bool":{"kms:GrantIsForAWSResource":"true"},"StringEquals":{"kms:CallerAccount":"${{ vars.AXON_AWS_ACCOUNT_ID }}","kms:ViaService":"dynamodb.us-east-1.amazonaws.com"}}}]}

      - name: Restore and validate temporary table
        id: restore
        env:
          REQUIRE_VAULT_LOCK: ${{ github.event_name == 'schedule' || inputs.require_vault_lock }}
          RETAIN_RESTORE: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.retain_fargate_restore &&
                matrix.target == 'fargate' }}
          RESULT_FILE: ${{ runner.temp }}/recovery-${{ matrix.target }}.json
        run: |
          set -euo pipefail
          arguments=(--exercise-restore)
          if [[ "${REQUIRE_VAULT_LOCK}" == "true" ]]; then
            arguments+=(--require-vault-lock)
          fi
          if [[ "${RETAIN_RESTORE}" == "true" ]]; then
            arguments+=(--keep-restored-table)
          fi
          python scripts/operations/validate_state_recovery.py \
            --stack-name "${{ matrix.stack_name }}" \
            "${arguments[@]}" |
            tee "${RESULT_FILE}"
          python - "${RESULT_FILE}" "${GITHUB_OUTPUT}" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import sys
          from pathlib import Path

          result_path = Path(sys.argv[1])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          exercise = result.get("restoreExercise") or {}
          target = exercise.get("targetTable") or ""
          retained = exercise.get("retained") is True
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"target_table={target}\n")
              output.write(f"retained={str(retained).lower()}\n")
          with Path(sys.argv[3]).open("a", encoding="utf-8") as summary:
              summary.write("## Recovery exercise\n\n")
              summary.write(f"- Target table: `{target}`\n")
              summary.write(f"- Retained: `{str(retained).lower()}`\n")
          PY

      - name: Preserve recovery evidence
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axonllm-recovery-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90
