name: Deploy AgentCore production

on:
  workflow_call:
    inputs:
      evidence_run_id:
        description: Successful tagged release-security workflow run
        required: true
        type: string
      release_commit_sha:
        description: Full commit SHA recorded by the signed release
        required: true
        type: string
      agentcore_image_reference:
        description: Immutable private AgentCore ECR digest URI
        required: true
        type: string
      control_plane_image_reference:
        description: Immutable private Fargate ECR digest URI
        required: true
        type: string
      setup_config_s3_version_id:
        description: Immutable S3 version ID for the reviewed setup configuration
        required: true
        type: string
      setup_config_sha256:
        description: Lowercase SHA-256 of the reviewed setup configuration
        required: true
        type: string
      certification_config_s3_version_id:
        description: Immutable S3 version ID for the reviewed certification configuration
        required: true
        type: string
      certification_config_sha256:
        description: Lowercase SHA-256 of the reviewed certification configuration
        required: true
        type: string
      production_validation_config_s3_version_id:
        description: Immutable S3 version ID for the reviewed control-plane validation
        required: true
        type: string
      production_validation_config_sha256:
        description: Lowercase SHA-256 of the control-plane validation configuration
        required: true
        type: string
      launch_rehearsal_detailed_report_s3_uri:
        description: Detailed report URI output by the protected launch-rehearsal workflow
        required: true
        type: string
      launch_rehearsal_detailed_report_s3_version_id:
        description: Detailed report VersionId output by the protected launch-rehearsal workflow
        required: true
        type: string
      launch_rehearsal_detailed_report_sha256:
        description: Detailed report SHA-256 output by the protected launch-rehearsal workflow
        required: true
        type: string
      launch_rehearsal_detailed_signature_s3_uri:
        description: Detailed signature URI output by the protected launch-rehearsal workflow
        required: true
        type: string
      launch_rehearsal_detailed_signature_s3_version_id:
        description: Detailed signature VersionId output by the protected launch-rehearsal workflow
        required: true
        type: string
      launch_rehearsal_detailed_signature_sha256:
        description: Detailed signature SHA-256 output by the protected launch-rehearsal workflow
        required: true
        type: string
      external_oidc_report_s3_uri:
        description: Report URI output by the protected external-OIDC certification workflow
        required: true
        type: string
      external_oidc_report_s3_version_id:
        description: Report VersionId output by the protected external-OIDC certification workflow
        required: true
        type: string
      external_oidc_report_sha256:
        description: Report SHA-256 output by the protected external-OIDC certification workflow
        required: true
        type: string
      external_oidc_signature_s3_uri:
        description: Signature URI output by the protected external-OIDC certification workflow
        required: true
        type: string
      external_oidc_signature_s3_version_id:
        description: Signature VersionId output by the protected external-OIDC certification workflow
        required: true
        type: string
      external_oidc_signature_sha256:
        description: Signature SHA-256 output by the protected external-OIDC certification workflow
        required: true
        type: string
      qualification_teardown_receipt_s3_uri:
        description: Receipt URI output by the protected qualification teardown job
        required: true
        type: string
      qualification_teardown_receipt_s3_version_id:
        description: Receipt VersionId output by the protected qualification teardown job
        required: true
        type: string
      qualification_teardown_receipt_sha256:
        description: Receipt SHA-256 output by the protected qualification teardown job
        required: true
        type: string
      qualification_teardown_signature_s3_uri:
        description: Signature URI output by the protected qualification teardown job
        required: true
        type: string
      qualification_teardown_signature_s3_version_id:
        description: Signature VersionId output by the protected qualification teardown job
        required: true
        type: string
      qualification_teardown_signature_sha256:
        description: Signature SHA-256 output by the protected qualification teardown job
        required: true
        type: string
      operation:
        description: Deploy or restore a previously signed image and secret version
        required: false
        default: deploy
        type: string
      rollback_provider_secret_version:
        description: Existing reviewed AWSCURRENT target; required only for rollback
        required: false
        type: string
      change_id:
        description: Approved change or incident identifier
        required: true
        type: string
permissions:
  contents: read
  id-token: write

concurrency:
  group: agentcore-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_CACHE_DIR: /tmp/axonllm-uv-cache
  UV_VERSION: "0.10.7"

jobs:
  verify-agentcore:
    name: Verify AgentCore release target
    uses: ./.github/workflows/deploy-verification.yml
    with:
      evidence_run_id: ${{ inputs.evidence_run_id }}
      commit_sha: ${{ inputs.release_commit_sha }}
      image_reference: ${{ inputs.agentcore_image_reference }}
      target: agentcore
      aws_region: us-east-1

  verify-control-plane:
    name: Verify control-plane release target
    uses: ./.github/workflows/deploy-verification.yml
    with:
      evidence_run_id: ${{ inputs.evidence_run_id }}
      commit_sha: ${{ inputs.release_commit_sha }}
      image_reference: ${{ inputs.control_plane_image_reference }}
      target: fargate
      aws_region: us-east-1

  deploy:
    name: Deploy, certify, and record production
    needs:
      - verify-agentcore
      - verify-control-plane
    runs-on:
      group: axonllm-production
      labels: axonllm-production-allowlisted
    timeout-minutes: 180
    environment: agentcore-production-deploy
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out reviewed deployment tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up supported Node for CDK
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Validate immutable production inputs
        env:
          AGENTCORE_IMAGE: ${{ inputs.agentcore_image_reference }}
          AWS_ACCOUNT_ID: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1
          CALLED_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          CERTIFICATION_CONFIG_SHA256: ${{ inputs.certification_config_sha256 }}
          CERTIFICATION_CONFIG_URI: ${{ vars.AXON_AGENTCORE_CERTIFICATION_CONFIG_S3_URI }}
          CERTIFICATION_CONFIG_VERSION_ID: ${{ inputs.certification_config_s3_version_id }}
          CONTROL_PLANE_IMAGE: ${{ inputs.control_plane_image_reference }}
          DEPLOY_ROLE_ARN: ${{ secrets.AXON_AGENTCORE_DEPLOY_ROLE_ARN }}
          EVIDENCE_BUCKET: ${{ vars.AXON_DEPLOYMENT_EVIDENCE_BUCKET }}
          EVIDENCE_PREFIX: ${{ vars.AXON_DEPLOYMENT_EVIDENCE_PREFIX }}
          EVIDENCE_STORAGE_KEY_ARN: ${{ vars.AXON_DEPLOYMENT_EVIDENCE_KMS_KEY_ARN }}
          EXTERNAL_OIDC_EVIDENCE_PREFIX: ${{ vars.AXON_EXTERNAL_OIDC_EVIDENCE_PREFIX }}
          EXTERNAL_OIDC_REPORT_SHA256: ${{ inputs.external_oidc_report_sha256 }}
          EXTERNAL_OIDC_REPORT_URI: ${{ inputs.external_oidc_report_s3_uri }}
          EXTERNAL_OIDC_REPORT_VERSION_ID: ${{ inputs.external_oidc_report_s3_version_id }}
          EXTERNAL_OIDC_SIGNATURE_SHA256: ${{ inputs.external_oidc_signature_sha256 }}
          EXTERNAL_OIDC_SIGNATURE_URI: ${{ inputs.external_oidc_signature_s3_uri }}
          EXTERNAL_OIDC_SIGNATURE_VERSION_ID: ${{ inputs.external_oidc_signature_s3_version_id }}
          LAUNCH_REHEARSAL_REPORT_SHA256: ${{ inputs.launch_rehearsal_detailed_report_sha256 }}
          LAUNCH_REHEARSAL_REPORT_URI: ${{ inputs.launch_rehearsal_detailed_report_s3_uri }}
          LAUNCH_REHEARSAL_REPORT_VERSION_ID: ${{ inputs.launch_rehearsal_detailed_report_s3_version_id }}
          LAUNCH_REHEARSAL_SIGNATURE_SHA256: ${{ inputs.launch_rehearsal_detailed_signature_sha256 }}
          LAUNCH_REHEARSAL_SIGNATURE_URI: ${{ inputs.launch_rehearsal_detailed_signature_s3_uri }}
          LAUNCH_REHEARSAL_SIGNATURE_VERSION_ID: ${{ inputs.launch_rehearsal_detailed_signature_s3_version_id }}
          OPERATION: ${{ inputs.operation }}
          PREREQUISITE_SIGNING_KEY_ARN: ${{ vars.AXON_AGENTCORE_PREREQUISITE_SIGNING_KEY_ARN }}
          PRODUCTION_VALIDATION_CONFIG_SHA256: ${{ inputs.production_validation_config_sha256 }}
          PRODUCTION_VALIDATION_CONFIG_URI: ${{ vars.AXON_AGENTCORE_PRODUCTION_VALIDATION_CONFIG_S3_URI }}
          PRODUCTION_VALIDATION_CONFIG_VERSION_ID: ${{ inputs.production_validation_config_s3_version_id }}
          PROVIDER_SOURCE_SECRET_ARN: ${{ vars.AXON_AGENTCORE_PRODUCTION_PROVIDER_SOURCE_SECRET_ARN }}
          QUALIFICATION_TEARDOWN_EVIDENCE_PREFIX: ${{ vars.AXON_AGENTCORE_QUALIFICATION_TEARDOWN_EVIDENCE_PREFIX }}
          REHEARSAL_EVIDENCE_PREFIX: ${{ vars.AXON_AGENTCORE_REHEARSAL_EVIDENCE_PREFIX }}
          PARENT_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          RELEASE_COMMIT: ${{ inputs.release_commit_sha }}
          RELEASE_RUN_ID: ${{ inputs.evidence_run_id }}
          ROLLBACK_SECRET_VERSION: ${{ inputs.rollback_provider_secret_version }}
          SETUP_CONFIG_SHA256: ${{ inputs.setup_config_sha256 }}
          SETUP_CONFIG_URI: ${{ vars.AXON_AGENTCORE_SETUP_CONFIG_S3_URI }}
          SETUP_CONFIG_VERSION_ID: ${{ inputs.setup_config_s3_version_id }}
          TRANSITION_SIGNING_KEY_ARN: ${{ vars.AXON_AGENTCORE_TRANSITION_SIGNING_KEY_ARN }}
          TEARDOWN_RECEIPT_SHA256: ${{ inputs.qualification_teardown_receipt_sha256 }}
          TEARDOWN_RECEIPT_URI: ${{ inputs.qualification_teardown_receipt_s3_uri }}
          TEARDOWN_RECEIPT_VERSION_ID: ${{ inputs.qualification_teardown_receipt_s3_version_id }}
          TEARDOWN_SIGNATURE_SHA256: ${{ inputs.qualification_teardown_signature_sha256 }}
          TEARDOWN_SIGNATURE_URI: ${{ inputs.qualification_teardown_signature_s3_uri }}
          TEARDOWN_SIGNATURE_VERSION_ID: ${{ inputs.qualification_teardown_signature_s3_version_id }}
          VERIFIED_AGENTCORE: ${{ needs.verify-agentcore.outputs.verified_image }}
          VERIFIED_CONTROL_PLANE: ${{ needs.verify-control-plane.outputs.verified_image }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          parent_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/launch-agentcore-production.yml@refs/heads/main"
          [[ "${GITHUB_WORKFLOW_REF}" == "${parent_workflow_ref}" ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA}" == "${RELEASE_COMMIT}" ]]
          [[ "${CALLED_WORKFLOW_COMMIT}" == "${RELEASE_COMMIT}" ]]
          [[ "${PARENT_WORKFLOW_COMMIT}" == "${RELEASE_COMMIT}" ]]
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ "${RELEASE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" == "us-east-1" ]]
          [[ "${SETUP_CONFIG_URI}" =~ ^s3://[a-z0-9.-]+/.+[^/]$ ]]
          [[ "${CERTIFICATION_CONFIG_URI}" =~ ^s3://[a-z0-9.-]+/.+[^/]$ ]]
          [[ "${PRODUCTION_VALIDATION_CONFIG_URI}" =~ ^s3://[a-z0-9.-]+/.+[^/]$ ]]
          [[ "${LAUNCH_REHEARSAL_REPORT_URI}" =~ ^s3://[a-z0-9.-]+/.+[^/]$ ]]
          [[ "${LAUNCH_REHEARSAL_SIGNATURE_URI}" =~ ^s3://[a-z0-9.-]+/.+[^/]$ ]]
          rehearsal_root="s3://${EVIDENCE_BUCKET}/${REHEARSAL_EVIDENCE_PREFIX}/launch-rehearsal-reports/${GITHUB_REPOSITORY}/"
          [[ "${LAUNCH_REHEARSAL_REPORT_URI}" == "${rehearsal_root}"*"/agentcore-launch-rehearsal-evidence.json" ]]
          [[ "${LAUNCH_REHEARSAL_SIGNATURE_URI}" == "${rehearsal_root}"*"/agentcore-launch-rehearsal-evidence-kms-signature.json" ]]
          [[ "${LAUNCH_REHEARSAL_REPORT_URI%/agentcore-launch-rehearsal-evidence.json}" == "${LAUNCH_REHEARSAL_SIGNATURE_URI%/agentcore-launch-rehearsal-evidence-kms-signature.json}" ]]
          [[ "${LAUNCH_REHEARSAL_REPORT_URI}" != "${LAUNCH_REHEARSAL_SIGNATURE_URI}" ]]
          [[ "${EXTERNAL_OIDC_EVIDENCE_PREFIX}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,255}$ ]]
          [[ "${EXTERNAL_OIDC_EVIDENCE_PREFIX}" != */ ]]
          [[ "${EXTERNAL_OIDC_EVIDENCE_PREFIX}" != *//* ]]
          external_oidc_root="s3://${EVIDENCE_BUCKET}/${EXTERNAL_OIDC_EVIDENCE_PREFIX}/${GITHUB_REPOSITORY}/${RELEASE_COMMIT}/"
          [[ "${EXTERNAL_OIDC_REPORT_URI}" == "${external_oidc_root}"*"/external-oidc-agentcore-report.json" ]]
          [[ "${EXTERNAL_OIDC_SIGNATURE_URI}" == "${external_oidc_root}"*"/external-oidc-agentcore-kms-signature.json" ]]
          [[ "${EXTERNAL_OIDC_REPORT_URI%/external-oidc-agentcore-report.json}" == "${EXTERNAL_OIDC_SIGNATURE_URI%/external-oidc-agentcore-kms-signature.json}" ]]
          [[ "${EXTERNAL_OIDC_REPORT_URI}" != "${EXTERNAL_OIDC_SIGNATURE_URI}" ]]
          teardown_root="s3://${EVIDENCE_BUCKET}/${QUALIFICATION_TEARDOWN_EVIDENCE_PREFIX}/${GITHUB_REPOSITORY}/${RELEASE_COMMIT}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          [[ "${TEARDOWN_RECEIPT_URI}" == "${teardown_root}/qualification-teardown-receipt.json" ]]
          [[ "${TEARDOWN_SIGNATURE_URI}" == "${teardown_root}/qualification-teardown-signature.json" ]]
          [[ "${TEARDOWN_RECEIPT_URI}" != "${TEARDOWN_SIGNATURE_URI}" ]]
          [[ "${SETUP_CONFIG_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${SETUP_CONFIG_VERSION_ID}" != "null" ]]
          [[ "${CERTIFICATION_CONFIG_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${CERTIFICATION_CONFIG_VERSION_ID}" != "null" ]]
          [[ "${PRODUCTION_VALIDATION_CONFIG_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${PRODUCTION_VALIDATION_CONFIG_VERSION_ID}" != "null" ]]
          [[ "${LAUNCH_REHEARSAL_REPORT_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${LAUNCH_REHEARSAL_REPORT_VERSION_ID}" != "null" ]]
          [[ "${LAUNCH_REHEARSAL_SIGNATURE_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${LAUNCH_REHEARSAL_SIGNATURE_VERSION_ID}" != "null" ]]
          [[ "${EXTERNAL_OIDC_REPORT_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${EXTERNAL_OIDC_REPORT_VERSION_ID}" != "null" ]]
          [[ "${EXTERNAL_OIDC_SIGNATURE_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${EXTERNAL_OIDC_SIGNATURE_VERSION_ID}" != "null" ]]
          [[ "${TEARDOWN_RECEIPT_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${TEARDOWN_RECEIPT_VERSION_ID}" != "null" ]]
          [[ "${TEARDOWN_SIGNATURE_VERSION_ID}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]
          [[ "${TEARDOWN_SIGNATURE_VERSION_ID}" != "null" ]]
          [[ "${SETUP_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${CERTIFICATION_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${PRODUCTION_VALIDATION_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LAUNCH_REHEARSAL_REPORT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LAUNCH_REHEARSAL_SIGNATURE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${EXTERNAL_OIDC_REPORT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${EXTERNAL_OIDC_SIGNATURE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${TEARDOWN_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${TEARDOWN_SIGNATURE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${PROVIDER_SOURCE_SECRET_ARN}" =~ ^arn:aws:secretsmanager:us-east-1:${AWS_ACCOUNT_ID}:secret:.+ ]]
          [[ "${DEPLOY_ROLE_ARN}" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/.+ ]]
          [[ "${PREREQUISITE_SIGNING_KEY_ARN}" =~ ^arn:aws:kms:us-east-1:${AWS_ACCOUNT_ID}:key/[A-Za-z0-9-]+$ ]]
          [[ "${TRANSITION_SIGNING_KEY_ARN}" =~ ^arn:aws:kms:us-east-1:${AWS_ACCOUNT_ID}:key/[A-Za-z0-9-]+$ ]]
          [[ "${EVIDENCE_STORAGE_KEY_ARN}" =~ ^arn:aws:kms:us-east-1:${AWS_ACCOUNT_ID}:key/[A-Za-z0-9-]+$ ]]
          [[ "${PREREQUISITE_SIGNING_KEY_ARN}" != "${TRANSITION_SIGNING_KEY_ARN}" ]]
          [[ "${EVIDENCE_STORAGE_KEY_ARN}" != "${PREREQUISITE_SIGNING_KEY_ARN}" ]]
          [[ "${EVIDENCE_STORAGE_KEY_ARN}" != "${TRANSITION_SIGNING_KEY_ARN}" ]]
          [[ "${EVIDENCE_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "${EVIDENCE_PREFIX}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]
          [[ "${EVIDENCE_PREFIX}" != */ ]]
          [[ "${EVIDENCE_PREFIX}" != *//* ]]
          [[ "${AGENTCORE_IMAGE}" == "${VERIFIED_AGENTCORE}" ]]
          [[ "${CONTROL_PLANE_IMAGE}" == "${VERIFIED_CONTROL_PLANE}" ]]
          if [[ "${OPERATION}" == "rollback" ]]; then
            [[ "${ROLLBACK_SECRET_VERSION}" =~ ^[A-Za-z0-9._-]{1,256}$ ]]
          else
            [[ "${OPERATION}" == "deploy" ]]
            [[ -z "${ROLLBACK_SECRET_VERSION}" ]]
          fi

      - name: Require successful CI for deployment tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/deployment-tooling-ci.json"
          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "head_sha=${GITHUB_SHA}" \
            -f status=completed \
            -f per_page=100 >"${response}"
          jq -e --arg commit "${GITHUB_SHA}" '
            [.workflow_runs[] | select(
              .head_sha == $commit
              and .status == "completed"
              and .conclusion == "success"
            )] | length > 0
          ' "${response}" >/dev/null

      - name: Install locked deployment dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-deps "uv==${UV_VERSION}"
          uv sync --frozen --extra agentcore --extra dev --extra security
          uv run --frozen --no-sync playwright install chromium
          npm ci \
            --prefix src/gateway/deployment/infra \
            --ignore-scripts \
            --no-audit \
            --no-fund
          src/gateway/deployment/infra/node_modules/.bin/cdk --version

      - name: Install checksum-verified security tools
        run: |
          scripts/ci/install_security_tools.sh "${RUNNER_TEMP}/bin"
          printf '%s\n' "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Synthesize and validate production infrastructure
        env:
          CDK_CI_OUTDIR: ${{ runner.temp }}/cdk.out
          JSII_RUNTIME_PACKAGE_CACHE_ROOT: ${{ runner.temp }}/jsii-cache
        run: |
          set -euo pipefail
          scripts/ci/synthesize_and_verify_cdk.sh "${CDK_CI_OUTDIR}"
          for template in \
            "${CDK_CI_OUTDIR}/identity/AxonLLMIdentityStack.template.json" \
            "${CDK_CI_OUTDIR}/agentcore/AxonLLMAgentCoreStack.template.json" \
            "${CDK_CI_OUTDIR}/control-plane/AxonLLMControlPlaneStack.template.json"
          do
            trivy config \
              --disable-telemetry \
              --skip-check-update \
              --ignorefile .github/trivyignore.yaml \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              "${template}"
          done

      - name: Download signed release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: axonllm-release-evidence-${{ inputs.release_commit_sha }}
          path: ${{ runner.temp }}/release-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}

      - name: Configure production AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AXON_AGENTCORE_DEPLOY_ROLE_ARN }}
          role-session-name: AxonLLMAgentCoreProduction
          role-duration-seconds: 10800
          allowed-account-ids: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Require reviewed templates before transactional promotion
        run: |
          set -euo pipefail
          for specification in \
            "AxonLLMIdentityStack:${RUNNER_TEMP}/cdk.out/identity/AxonLLMIdentityStack.template.json" \
            "AxonLLMAgentCoreStack:${RUNNER_TEMP}/cdk.out/agentcore/AxonLLMAgentCoreStack.template.json" \
            "AxonLLMControlPlaneStack:${RUNNER_TEMP}/cdk.out/control-plane/AxonLLMControlPlaneStack.template.json"
          do
            stack=${specification%%:*}
            template=${specification#*:}
            deployed="${RUNNER_TEMP}/${stack}-deployed-template.json"
            error="${RUNNER_TEMP}/${stack}-get-template.err"
            if ! aws cloudformation get-template \
              --stack-name "${stack}" \
              --template-stage Original \
              --query TemplateBody \
              --output json >"${deployed}" 2>"${error}"
            then
              if grep -Fq "does not exist" "${error}"; then
                continue
              fi
              cat "${error}" >&2
              exit 1
            fi
            uv run --frozen --no-sync python - \
              "${template}" "${deployed}" "${stack}" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          deployed = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if isinstance(deployed, str):
              deployed = json.loads(deployed)
          if deployed != expected:
              raise SystemExit(
                  f"{sys.argv[3]} does not use the reviewed template; "
                  "complete a separate approved infrastructure migration first"
              )
          PY
          done

      - name: Reverify release evidence under deployment authority
        id: release
        env:
          AGENTCORE_IMAGE: ${{ inputs.agentcore_image_reference }}
          CONTROL_PLANE_IMAGE: ${{ inputs.control_plane_image_reference }}
          EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          RELEASE_COMMIT: ${{ inputs.release_commit_sha }}
          RELEASE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          agentcore_digest=${AGENTCORE_IMAGE##*@}
          fargate_digest=${CONTROL_PLANE_IMAGE##*@}
          output="${RUNNER_TEMP}/release-output"
          uv run --frozen --no-sync python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --image-digest "${agentcore_digest}" \
            --signing-account-id "${{ vars.AXON_AWS_ACCOUNT_ID }}" \
            --require-release-tag \
            --target agentcore \
            --run-id "${RELEASE_RUN_ID}" \
            --github-output "${output}"
          uv run --frozen --no-sync python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --image-digest "${fargate_digest}" \
            --signing-account-id "${{ vars.AXON_AWS_ACCOUNT_ID }}" \
            --require-release-tag \
            --target fargate \
            --run-id "${RELEASE_RUN_ID}"
          signing_key_arn=$(sed -n 's/^signing_key_arn=//p' "${output}")
          [[ "${signing_key_arn}" =~ ^arn:aws:kms:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:key/[A-Za-z0-9-]+$ ]]
          uv run --frozen --no-sync python scripts/release/kms_evidence.py verify \
            --artifact "${EVIDENCE_DIR}/provenance.intoto.json" \
            --bundle "${EVIDENCE_DIR}/provenance-kms-signature.json" \
            --key-arn "${signing_key_arn}"
          uv run --frozen --no-sync python scripts/release/kms_evidence.py verify \
            --artifact "${EVIDENCE_DIR}/release-manifest.json" \
            --bundle "${EVIDENCE_DIR}/manifest-kms-signature.json" \
            --key-arn "${signing_key_arn}"

      - name: Verify immutable transition journal storage
        env:
          EVIDENCE_BUCKET: ${{ vars.AXON_DEPLOYMENT_EVIDENCE_BUCKET }}
          EVIDENCE_PREFIX: ${{ vars.AXON_DEPLOYMENT_EVIDENCE_PREFIX }}
        run: |
          set -euo pipefail
          versioning=$(aws s3api get-bucket-versioning --bucket "${EVIDENCE_BUCKET}")
          jq -e '.Status == "Enabled"' <<<"${versioning}" >/dev/null
          locking=$(aws s3api get-object-lock-configuration --bucket "${EVIDENCE_BUCKET}")
          jq -e '.ObjectLockConfiguration.ObjectLockEnabled == "Enabled"' \
            <<<"${locking}" >/dev/null
          encryption=$(aws s3api get-bucket-encryption --bucket "${EVIDENCE_BUCKET}")
          jq -e '
            [.ServerSideEncryptionConfiguration.Rules[]
             | select(
                 .ApplyServerSideEncryptionByDefault.SSEAlgorithm == "aws:kms"
                 or .ApplyServerSideEncryptionByDefault.SSEAlgorithm == "aws:kms:dsse"
               )
             | select(.BucketKeyEnabled == true)]
            | length > 0
          ' <<<"${encryption}" >/dev/null
          policy="${RUNNER_TEMP}/deployment-evidence-bucket-policy.json"
          aws s3api get-bucket-policy \
            --bucket "${EVIDENCE_BUCKET}" \
            --query Policy \
            --output text >"${policy}"
          uv run --frozen --no-sync python - \
            "${policy}" "${EVIDENCE_BUCKET}" "${EVIDENCE_PREFIX}" <<'PY'
          import json
          from pathlib import Path
          import sys

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          statements = document.get("Statement") if isinstance(document, dict) else None
          if isinstance(statements, dict):
              statements = [statements]
          target = f"arn:aws:s3:::{sys.argv[2]}/{sys.argv[3]}/"

          def values(value):
              return value if isinstance(value, list) else [value]

          def covers(resource):
              return (
                  isinstance(resource, str)
                  and resource.endswith("*")
                  and target.startswith(resource[:-1])
              )

          protected = any(
              isinstance(statement, dict)
              and statement.get("Effect") == "Deny"
              and "Condition" not in statement
              and "NotPrincipal" not in statement
              and (
                  statement.get("Principal") == "*"
                  or (
                      isinstance(statement.get("Principal"), dict)
                      and "*" in values(statement["Principal"].get("AWS"))
                  )
              )
              and any(
                  action in {"*", "s3:*", "s3:DeleteObject"}
                  for action in values(statement.get("Action"))
              )
              and any(covers(resource) for resource in values(statement.get("Resource")))
              for statement in (statements or [])
          )
          if not protected:
              raise SystemExit(
                  "evidence bucket policy must unconditionally deny "
                  "s3:DeleteObject for every principal under the journal prefix"
              )
          PY
          base_key="${EVIDENCE_PREFIX}/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          retain_until=$(date -u -d "+2555 days" "+%Y-%m-%dT%H:%M:%SZ")
          printf 'EVIDENCE_BASE_KEY=%s\n' "${base_key}" >>"${GITHUB_ENV}"
          printf 'EVIDENCE_RETAIN_UNTIL=%s\n' "${retain_until}" >>"${GITHUB_ENV}"

      - name: Fetch and verify qualification teardown evidence
        env:
          AWS_ACCOUNT_ID: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          EVIDENCE_STORAGE_KEY_ARN: ${{ vars.AXON_DEPLOYMENT_EVIDENCE_KMS_KEY_ARN }}
          RELEASE_COMMIT: ${{ inputs.release_commit_sha }}
          SIGNING_KEY_ARN: ${{ vars.AXON_AGENTCORE_PREREQUISITE_SIGNING_KEY_ARN }}
          TEARDOWN_RECEIPT_SHA256: ${{ inputs.qualification_teardown_receipt_sha256 }}
          TEARDOWN_RECEIPT_URI: ${{ inputs.qualification_teardown_receipt_s3_uri }}
          TEARDOWN_RECEIPT_VERSION_ID: ${{ inputs.qualification_teardown_receipt_s3_version_id }}
          TEARDOWN_SIGNATURE_SHA256: ${{ inputs.qualification_teardown_signature_sha256 }}
          TEARDOWN_SIGNATURE_URI: ${{ inputs.qualification_teardown_signature_s3_uri }}
          TEARDOWN_SIGNATURE_VERSION_ID: ${{ inputs.qualification_teardown_signature_s3_version_id }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/qualification-teardown-receipt.json"
          signature="${RUNNER_TEMP}/qualification-teardown-signature.json"
          receipt_metadata="${RUNNER_TEMP}/qualification-teardown-receipt-metadata.json"
          signature_metadata="${RUNNER_TEMP}/qualification-teardown-signature-metadata.json"
          receipt_location="${TEARDOWN_RECEIPT_URI#s3://}"
          signature_location="${TEARDOWN_SIGNATURE_URI#s3://}"
          aws s3api head-object \
            --bucket "${receipt_location%%/*}" \
            --key "${receipt_location#*/}" \
            --version-id "${TEARDOWN_RECEIPT_VERSION_ID}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --checksum-mode ENABLED \
            --output json \
            --no-cli-pager >"${receipt_metadata}"
          aws s3api head-object \
            --bucket "${signature_location%%/*}" \
            --key "${signature_location#*/}" \
            --version-id "${TEARDOWN_SIGNATURE_VERSION_ID}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --checksum-mode ENABLED \
            --output json \
            --no-cli-pager >"${signature_metadata}"
          aws s3api get-object \
            --bucket "${receipt_location%%/*}" \
            --key "${receipt_location#*/}" \
            --version-id "${TEARDOWN_RECEIPT_VERSION_ID}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --checksum-mode ENABLED \
            "${receipt}" >/dev/null
          aws s3api get-object \
            --bucket "${signature_location%%/*}" \
            --key "${signature_location#*/}" \
            --version-id "${TEARDOWN_SIGNATURE_VERSION_ID}" \
            --expected-bucket-owner "${AWS_ACCOUNT_ID}" \
            --checksum-mode ENABLED \
            "${signature}" >/dev/null
          uv run --frozen --no-sync python - \
            "${receipt_metadata}" \
            "${receipt}" \
            "${TEARDOWN_RECEIPT_VERSION_ID}" \
            "${signature_metadata}" \
            "${signature}" \
            "${TEARDOWN_SIGNATURE_VERSION_ID}" \
            "${EVIDENCE_STORAGE_KEY_ARN}" <<'PY'
          import base64
          from datetime import datetime, timezone
          import hashlib
          import json
          from pathlib import Path
          import sys

          storage_key = sys.argv[7]
          now = datetime.now(timezone.utc)
          for metadata_name, artifact_name, version_id in (
              (sys.argv[1], sys.argv[2], sys.argv[3]),
              (sys.argv[4], sys.argv[5], sys.argv[6]),
          ):
              metadata = json.loads(
                  Path(metadata_name).read_text(encoding="utf-8")
              )
              artifact = Path(artifact_name).read_bytes()
              retained = datetime.fromisoformat(
                  str(metadata.get("ObjectLockRetainUntilDate", "")).replace(
                      "Z", "+00:00"
                  )
              )
              checksum = base64.b64encode(
                  hashlib.sha256(artifact).digest()
              ).decode("ascii")
              if not (
                  metadata.get("VersionId") == version_id
                  and metadata.get("ServerSideEncryption") == "aws:kms"
                  and metadata.get("SSEKMSKeyId") == storage_key
                  and metadata.get("BucketKeyEnabled") is True
                  and metadata.get("ObjectLockMode") == "COMPLIANCE"
                  and retained.astimezone(timezone.utc) > now
                  and metadata.get("ContentType") == "application/json"
                  and metadata.get("ContentLength") == len(artifact)
                  and metadata.get("ChecksumSHA256") == checksum
              ):
                  raise SystemExit(
                      "qualification teardown evidence is not the expected "
                      "COMPLIANCE-locked object version"
                  )
          PY
          printf '%s  %s\n' "${TEARDOWN_RECEIPT_SHA256}" "${receipt}" \
            | sha256sum --check --status
          printf '%s  %s\n' "${TEARDOWN_SIGNATURE_SHA256}" "${signature}" \
            | sha256sum --check --status
          chmod 0400 "${receipt}" "${signature}"
          uv run --frozen --no-sync python scripts/release/kms_evidence.py verify \
            --artifact "${receipt}" \
            --bundle "${signature}" \
            --key-arn "${SIGNING_KEY_ARN}"
          uv run --frozen --no-sync python \
            scripts/release/deployment_evidence.py \
            verify-qualification-teardown \
            --receipt "${receipt}" \
            --repository "${GITHUB_REPOSITORY}" \
            --release-commit "${RELEASE_COMMIT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --account-id "${AWS_ACCOUNT_ID}" \
            --region "${AWS_REGION}"

