name: Release security evidence

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Build, scan, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EVIDENCE_DIR: /tmp/axonllm-release-evidence
      SIGNING_KEY_ARN: ${{ vars.AXON_RELEASE_SIGNING_KEY_ARN }}
    outputs:
      agentcore_digest: ${{ steps.evidence.outputs.agentcore_digest }}
      fargate_digest: ${{ steps.evidence.outputs.fargate_digest }}
      standalone_amd64_digest: ${{ steps.evidence.outputs.standalone_amd64_digest }}
      standalone_arm64_digest: ${{ steps.evidence.outputs.standalone_arm64_digest }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out exact release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up pinned ARM64 emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          cache-image: false
          image: docker.io/tonistiigi/binfmt@sha256:465d3fdd28d0f2b871ba4b4ec98bd183292e96167f00d9fd40bd249f8632d705
          platforms: arm64

      - name: Set up pinned Buildx action
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          cleanup: true

      - name: Install checksum-verified scanners
        run: |
          scripts/ci/install_security_tools.sh "${RUNNER_TEMP}/bin"
          printf '%s\n' "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Establish isolated evidence directory
        run: |
          test ! -e "${EVIDENCE_DIR}"
          mkdir -m 0700 "${EVIDENCE_DIR}"

      - name: Scan release source
        run: >-
          trivy fs
          --disable-telemetry
          --scanners vuln,secret
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 1
          --format json
          --output "${EVIDENCE_DIR}/source-security.json"
          .

      - name: Generate source SBOM
        run: >-
          trivy fs
          --disable-telemetry
          --scanners vuln
          --format cyclonedx
          --output "${EVIDENCE_DIR}/source.cyclonedx.json"
          .

      - name: Build Fargate OCI release image
        run: >-
          docker buildx build
          --pull
          --platform linux/amd64
          --provenance=mode=max
          --metadata-file "${EVIDENCE_DIR}/build-metadata.json"
          --output "type=oci,dest=${EVIDENCE_DIR}/axonllm-linux-amd64.oci.tar"
          .

      - name: Build AgentCore OCI release image
        run: >-
          docker buildx build
          --pull
          --platform linux/arm64
          --provenance=mode=max
          --file infra/agentcore-image/Dockerfile
          --build-context project=.
          --metadata-file "${EVIDENCE_DIR}/agentcore-build-metadata.json"
          --output "type=oci,dest=${EVIDENCE_DIR}/axonllm-agentcore-linux-arm64.oci.tar"
          .

      - name: Build standalone ARM64 OCI release image
        run: >-
          docker buildx build
          --pull
          --platform linux/arm64
          --provenance=mode=max
          --file infra/standalone-image/Dockerfile
          --build-context project=.
          --metadata-file "${EVIDENCE_DIR}/standalone-arm64-build-metadata.json"
          --output "type=oci,dest=${EVIDENCE_DIR}/axonllm-standalone-linux-arm64.oci.tar"
          .

      - name: Scan Fargate OCI image and generate image SBOM
        run: |
          oci_layout=$(mktemp -d)
          trap 'rm -rf "${oci_layout}"' EXIT
          tar -xf "${EVIDENCE_DIR}/axonllm-linux-amd64.oci.tar" -C "${oci_layout}"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln,secret \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "${EVIDENCE_DIR}/image-security.json"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln \
            --format cyclonedx \
            --output "${EVIDENCE_DIR}/image.cyclonedx.json"

      - name: Scan AgentCore OCI image and generate image SBOM
        run: |
          oci_layout=$(mktemp -d)
          trap 'rm -rf "${oci_layout}"' EXIT
          tar -xf "${EVIDENCE_DIR}/axonllm-agentcore-linux-arm64.oci.tar" \
            -C "${oci_layout}"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln,secret \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "${EVIDENCE_DIR}/agentcore-image-security.json"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln \
            --format cyclonedx \
            --output "${EVIDENCE_DIR}/agentcore-image.cyclonedx.json"

      - name: Scan standalone ARM64 OCI image and generate image SBOM
        run: |
          oci_layout=$(mktemp -d)
          trap 'rm -rf "${oci_layout}"' EXIT
          tar -xf "${EVIDENCE_DIR}/axonllm-standalone-linux-arm64.oci.tar" \
            -C "${oci_layout}"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln,secret \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "${EVIDENCE_DIR}/standalone-arm64-image-security.json"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln \
            --format cyclonedx \
            --output "${EVIDENCE_DIR}/standalone-arm64-image.cyclonedx.json"

      - name: Create deterministic source artifact
        run: >-
          python scripts/release/create_source_archive.py
          --repository .
          --revision "${GITHUB_SHA}"
          --output "${EVIDENCE_DIR}/axonllm-source.tar.gz"

      - name: Create and self-verify release evidence
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python scripts/release/release_evidence.py create \
            --directory "${EVIDENCE_DIR}" \
            --repository "${RELEASE_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --ref "${RELEASE_REF}" \
            --workflow-ref "${RELEASE_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --event-name "${RELEASE_EVENT}" \
            --signing-key-arn "${SIGNING_KEY_ARN}"
          python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${RELEASE_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --signing-key-arn "${SIGNING_KEY_ARN}" \
            --target fargate
          python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${RELEASE_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --signing-key-arn "${SIGNING_KEY_ARN}" \
            --target agentcore
          python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${RELEASE_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --signing-key-arn "${SIGNING_KEY_ARN}" \
            --target standalone-amd64
          python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${RELEASE_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --signing-key-arn "${SIGNING_KEY_ARN}" \
            --target standalone-arm64

      - name: Read immutable evidence identities
        id: evidence
        run: |
          fargate_digest=$(jq -er \
            '.targets.fargate.digest' \
            "${EVIDENCE_DIR}/release-manifest.json")
          agentcore_digest=$(jq -er \
            '.targets.agentcore.digest' \
            "${EVIDENCE_DIR}/release-manifest.json")
          standalone_amd64_digest=$(jq -er \
            '.targets["standalone-amd64"].digest' \
            "${EVIDENCE_DIR}/release-manifest.json")
          standalone_arm64_digest=$(jq -er \
            '.targets["standalone-arm64"].digest' \
            "${EVIDENCE_DIR}/release-manifest.json")
          [[ "${fargate_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${agentcore_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${standalone_amd64_digest}" == "${fargate_digest}" ]]
          [[ "${standalone_arm64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf 'fargate_digest=%s\n' "${fargate_digest}"
            printf 'agentcore_digest=%s\n' "${agentcore_digest}"
            printf 'standalone_amd64_digest=%s\n' \
              "${standalone_amd64_digest}"
            printf 'standalone_arm64_digest=%s\n' \
              "${standalone_arm64_digest}"
          } >>"${GITHUB_OUTPUT}"

      - name: Configure release-signing AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AXON_RELEASE_SIGN_ROLE_ARN }}
          role-session-name: AxonLLMReleaseSign
          allowed-account-ids: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          inline-session-policy: >-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "kms:Sign",
                    "kms:Verify"
                  ],
                  "Resource": "${{ vars.AXON_RELEASE_SIGNING_KEY_ARN }}"
                }
              ]
            }

      - name: Sign and verify private release evidence
        run: |
          python scripts/release/kms_evidence.py sign \
            --artifact "${EVIDENCE_DIR}/provenance.intoto.json" \
            --bundle "${EVIDENCE_DIR}/provenance-kms-signature.json" \
            --key-arn "${SIGNING_KEY_ARN}"
          python scripts/release/kms_evidence.py sign \
            --artifact "${EVIDENCE_DIR}/release-manifest.json" \
            --bundle "${EVIDENCE_DIR}/manifest-kms-signature.json" \
            --key-arn "${SIGNING_KEY_ARN}"
          python scripts/release/kms_evidence.py verify \
            --artifact "${EVIDENCE_DIR}/provenance.intoto.json" \
            --bundle "${EVIDENCE_DIR}/provenance-kms-signature.json" \
            --key-arn "${SIGNING_KEY_ARN}"
          python scripts/release/kms_evidence.py verify \
            --artifact "${EVIDENCE_DIR}/release-manifest.json" \
            --bundle "${EVIDENCE_DIR}/manifest-kms-signature.json" \
            --key-arn "${SIGNING_KEY_ARN}"

      - name: Store private release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: axonllm-release-evidence-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          include-hidden-files: false
