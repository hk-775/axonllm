name: Release security evidence

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Build, scan, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EVIDENCE_DIR: /tmp/axonllm-release-evidence
    outputs:
      agentcore_digest: ${{ steps.evidence.outputs.agentcore_digest }}
      fargate_digest: ${{ steps.evidence.outputs.fargate_digest }}
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up pinned ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          cache-image: false
          image: docker.io/tonistiigi/binfmt@sha256:465d3fdd28d0f2b871ba4b4ec98bd183292e96167f00d9fd40bd249f8632d705
          platforms: arm64

      - name: Set up pinned Buildx action
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          cache-binary: false
          cleanup: true

      - name: Install checksum-verified scanners
        run: |
          scripts/ci/install_security_tools.sh "${RUNNER_TEMP}/bin"
          printf '%s\n' "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Establish isolated evidence directory
        run: |
          test ! -e "${EVIDENCE_DIR}"
          mkdir -m 0700 "${EVIDENCE_DIR}"

      - name: Scan release source
        run: >-
          trivy fs
          --disable-telemetry
          --scanners vuln,secret
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 1
          --format json
          --output "${EVIDENCE_DIR}/source-security.json"
          .

      - name: Generate source SBOM
        run: >-
          trivy fs
          --disable-telemetry
          --scanners vuln
          --format cyclonedx
          --output "${EVIDENCE_DIR}/source.cyclonedx.json"
          .

      - name: Build Fargate OCI release image
        run: >-
          docker buildx build
          --pull
          --platform linux/amd64
          --provenance=mode=max
          --metadata-file "${EVIDENCE_DIR}/build-metadata.json"
          --output "type=oci,dest=${EVIDENCE_DIR}/axonllm-linux-amd64.oci.tar"
          .

      - name: Build AgentCore OCI release image
        run: >-
          docker buildx build
          --pull
          --platform linux/arm64
          --provenance=mode=max
          --file infra/agentcore-image/Dockerfile
          --build-context project=.
          --metadata-file "${EVIDENCE_DIR}/agentcore-build-metadata.json"
          --output "type=oci,dest=${EVIDENCE_DIR}/axonllm-agentcore-linux-arm64.oci.tar"
          .

      - name: Scan Fargate OCI image and generate image SBOM
        run: |
          oci_layout=$(mktemp -d)
          trap 'rm -rf "${oci_layout}"' EXIT
          tar -xf "${EVIDENCE_DIR}/axonllm-linux-amd64.oci.tar" -C "${oci_layout}"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln,secret \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "${EVIDENCE_DIR}/image-security.json"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln \
            --format cyclonedx \
            --output "${EVIDENCE_DIR}/image.cyclonedx.json"

      - name: Scan AgentCore OCI image and generate image SBOM
        run: |
          oci_layout=$(mktemp -d)
          trap 'rm -rf "${oci_layout}"' EXIT
          tar -xf "${EVIDENCE_DIR}/axonllm-agentcore-linux-arm64.oci.tar" \
            -C "${oci_layout}"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln,secret \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "${EVIDENCE_DIR}/agentcore-image-security.json"
          trivy image \
            --disable-telemetry \
            --input "${oci_layout}" \
            --scanners vuln \
            --format cyclonedx \
            --output "${EVIDENCE_DIR}/agentcore-image.cyclonedx.json"

      - name: Create deterministic source artifact
        run: >-
          python scripts/release/create_source_archive.py
          --repository .
          --revision "${GITHUB_SHA}"
          --output "${EVIDENCE_DIR}/axonllm-source.tar.gz"

      - name: Create and self-verify release evidence
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python scripts/release/release_evidence.py create \
            --directory "${EVIDENCE_DIR}" \
            --repository "${RELEASE_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --ref "${RELEASE_REF}" \
            --workflow-ref "${RELEASE_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --event-name "${RELEASE_EVENT}"
          python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${RELEASE_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --target fargate
          python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${RELEASE_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --target agentcore

      - name: Read immutable evidence identities
        id: evidence
        run: |
          fargate_digest=$(jq -er \
            '.targets.fargate.digest' \
            "${EVIDENCE_DIR}/release-manifest.json")
          agentcore_digest=$(jq -er \
            '.targets.agentcore.digest' \
            "${EVIDENCE_DIR}/release-manifest.json")
          [[ "${fargate_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${agentcore_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'fargate_digest=%s\n' "${fargate_digest}" >>"${GITHUB_OUTPUT}"
          printf 'agentcore_digest=%s\n' "${agentcore_digest}" >>"${GITHUB_OUTPUT}"

      - name: Keylessly attest Fargate image digest
        id: attest-fargate
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: axonllm-linux-amd64
          subject-digest: ${{ steps.evidence.outputs.fargate_digest }}
          push-to-registry: false
          show-summary: false

      - name: Keylessly attest AgentCore image digest
        id: attest-agentcore
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: axonllm-agentcore-linux-arm64
          subject-digest: ${{ steps.evidence.outputs.agentcore_digest }}
          push-to-registry: false
          show-summary: false

      - name: Keylessly attest evidence manifest
        id: attest-manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.EVIDENCE_DIR }}/release-manifest.json
          push-to-registry: false
          show-summary: false

      - name: Preserve verification bundles
        env:
          AGENTCORE_BUNDLE: ${{ steps.attest-agentcore.outputs.bundle-path }}
          FARGATE_BUNDLE: ${{ steps.attest-fargate.outputs.bundle-path }}
          MANIFEST_BUNDLE: ${{ steps.attest-manifest.outputs.bundle-path }}
        run: |
          cp "${FARGATE_BUNDLE}" \
            "${EVIDENCE_DIR}/image-provenance.sigstore.jsonl"
          cp "${AGENTCORE_BUNDLE}" \
            "${EVIDENCE_DIR}/agentcore-image-provenance.sigstore.jsonl"
          cp "${MANIFEST_BUNDLE}" "${EVIDENCE_DIR}/manifest-provenance.sigstore.jsonl"

      - name: Store private release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axonllm-release-evidence-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          include-hidden-files: false
