name: Publish verified release images

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful tagged release-security workflow run
        required: true
        type: string
      commit_sha:
        description: Full release commit SHA
        required: true
        type: string
      release_tag:
        description: Immutable v-prefixed release tag
        required: true
        type: string
      aws_region:
        description: Region containing the private release repositories
        required: false
        default: us-east-1
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed OCI images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      agentcore_image: ${{ steps.result.outputs.agentcore_image }}
      fargate_image: ${{ steps.result.outputs.fargate_image }}

    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install checksum-verified registry client
        run: |
          scripts/ci/install_registry_tools.sh "${RUNNER_TEMP}/bin"
          printf '%s\n' "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Download private release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: axonllm-release-evidence-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/release-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}

      - name: Verify both signed release targets
        id: evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SIGNING_ACCOUNT_ID: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          EXPECTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

          fargate_output="${RUNNER_TEMP}/fargate-output"
          agentcore_output="${RUNNER_TEMP}/agentcore-output"
          python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${EXPECTED_REPOSITORY}" \
            --commit "${EXPECTED_COMMIT}" \
            --signing-account-id "${EXPECTED_SIGNING_ACCOUNT_ID}" \
            --require-release-tag \
            --target fargate \
            --run-id "${EVIDENCE_RUN_ID}" \
            --github-output "${fargate_output}"
          python scripts/release/release_evidence.py verify \
            --directory "${EVIDENCE_DIR}" \
            --repository "${EXPECTED_REPOSITORY}" \
            --commit "${EXPECTED_COMMIT}" \
            --signing-account-id "${EXPECTED_SIGNING_ACCOUNT_ID}" \
            --require-release-tag \
            --target agentcore \
            --run-id "${EVIDENCE_RUN_ID}" \
            --github-output "${agentcore_output}"

          fargate_digest=$(sed -n 's/^digest=//p' "${fargate_output}")
          agentcore_digest=$(sed -n 's/^digest=//p' "${agentcore_output}")
          release_ref=$(sed -n 's/^release_ref=//p' "${fargate_output}")
          run_attempt=$(sed -n 's/^run_attempt=//p' "${fargate_output}")
          signing_key_arn=$(sed -n 's/^signing_key_arn=//p' "${fargate_output}")
          [[ "${release_ref}" == "refs/tags/${EXPECTED_TAG}" ]]
          [[ "$(sed -n 's/^release_ref=//p' "${agentcore_output}")" == "${release_ref}" ]]
          [[ "${run_attempt}" =~ ^[1-9][0-9]*$ ]]
          [[ "$(sed -n 's/^run_attempt=//p' "${agentcore_output}")" == "${run_attempt}" ]]
          [[ "${fargate_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${agentcore_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${signing_key_arn}" =~ ^arn:aws:kms:us-east-1:${EXPECTED_SIGNING_ACCOUNT_ID}:key/[0-9a-f-]+$ ]]
          [[ "$(sed -n 's/^signing_key_arn=//p' "${agentcore_output}")" == "${signing_key_arn}" ]]

          {
            printf 'agentcore_digest=%s\n' "${agentcore_digest}"
            printf 'fargate_digest=%s\n' "${fargate_digest}"
            printf 'release_ref=%s\n' "${release_ref}"
            printf 'run_attempt=%s\n' "${run_attempt}"
            printf 'signing_key_arn=%s\n' "${signing_key_arn}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify release lineage
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.evidence.outputs.release_ref }}
          RELEASE_RUN_ATTEMPT: ${{ steps.evidence.outputs.run_attempt }}
        run: |
          set -euo pipefail
          release_run=$(gh api \
            "repos/${EXPECTED_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}")
          jq -e \
            --arg commit "${EXPECTED_COMMIT}" \
            --arg run_attempt "${RELEASE_RUN_ATTEMPT}" \
            --arg run_id "${EVIDENCE_RUN_ID}" \
            '(.id | tostring) == $run_id
              and (.run_attempt | tostring) == $run_attempt
              and .head_sha == $commit
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/release-security.yml"' \
            <<<"${release_run}"

          tag_object=$(gh api \
            "repos/${EXPECTED_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}")
          tag_type=$(jq -er '.object.type' <<<"${tag_object}")
          tag_sha=$(jq -er '.object.sha' <<<"${tag_object}")
          for _ in {1..5}; do
            [[ "${tag_type}" == "tag" ]] || break
            tag_object=$(gh api \
              "repos/${EXPECTED_REPOSITORY}/git/tags/${tag_sha}")
            tag_type=$(jq -er '.object.type' <<<"${tag_object}")
            tag_sha=$(jq -er '.object.sha' <<<"${tag_object}")
          done
          [[ "${tag_type}" == "commit" ]]
          [[ "${tag_sha}" == "${EXPECTED_COMMIT}" ]]

          ci_runs="${RUNNER_TEMP}/ci-runs.json"
          gh api \
            --method GET \
            "repos/${EXPECTED_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "head_sha=${EXPECTED_COMMIT}" \
            -f status=completed \
            -f per_page=100 \
            >"${ci_runs}"
          jq -e --arg commit "${EXPECTED_COMMIT}" \
            '[.workflow_runs[] | select(
              .head_sha == $commit and .conclusion == "success"
            )] | length > 0' \
            "${ci_runs}"

      - name: Validate fixed private ECR destinations
        env:
          AGENTCORE_REPOSITORY: ${{ vars.AXON_AGENTCORE_ECR_REPOSITORY }}
          AWS_ACCOUNT_ID: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ inputs.aws_region }}
          FARGATE_REPOSITORY: ${{ vars.AXON_FARGATE_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "${FARGATE_REPOSITORY}" == "${registry}/axonllm/fargate" ]]
          [[ "${AGENTCORE_REPOSITORY}" == "${registry}/axonllm/agentcore" ]]

      - name: Configure release-publisher AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.AXON_RELEASE_PUBLISH_ROLE_ARN }}
          role-session-name: AxonLLMReleasePublish
          allowed-account-ids: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          inline-session-policy: >-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "ecr:GetAuthorizationToken",
                  "Resource": "*"
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:BatchGetImage",
                    "ecr:CompleteLayerUpload",
                    "ecr:DescribeImages",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:InitiateLayerUpload",
                    "ecr:PutImage",
                    "ecr:UploadLayerPart"
                  ],
                  "Resource": [
                    "arn:aws:ecr:${{ inputs.aws_region }}:${{ vars.AXON_AWS_ACCOUNT_ID }}:repository/axonllm/fargate",
                    "arn:aws:ecr:${{ inputs.aws_region }}:${{ vars.AXON_AWS_ACCOUNT_ID }}:repository/axonllm/agentcore"
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": "kms:Verify",
                  "Resource": "arn:aws:kms:us-east-1:${{ vars.AXON_AWS_ACCOUNT_ID }}:key/*",
                  "Condition": {
                    "ForAnyValue:StringLike": {
                      "kms:ResourceAliases": "alias/axonllm/release-signing-v*"
                    }
                  }
                }
              ]
            }

      - name: Verify KMS-signed release evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          SIGNING_KEY_ARN: ${{ steps.evidence.outputs.signing_key_arn }}
        run: |
          python scripts/release/kms_evidence.py verify \
            --artifact "${EVIDENCE_DIR}/provenance.intoto.json" \
            --bundle "${EVIDENCE_DIR}/provenance-kms-signature.json" \
            --key-arn "${SIGNING_KEY_ARN}"
          python scripts/release/kms_evidence.py verify \
            --artifact "${EVIDENCE_DIR}/release-manifest.json" \
            --bundle "${EVIDENCE_DIR}/manifest-kms-signature.json" \
            --key-arn "${SIGNING_KEY_ARN}"

      - name: Authenticate to private ECR
        env:
          AWS_ACCOUNT_ID: ${{ vars.AXON_AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" |
            oras login --username AWS --password-stdin "${registry}"

      - name: Publish immutable Fargate and AgentCore images
        env:
          AGENTCORE_DIGEST: ${{ steps.evidence.outputs.agentcore_digest }}
          AGENTCORE_REPOSITORY: ${{ vars.AXON_AGENTCORE_ECR_REPOSITORY }}
          AWS_REGION: ${{ inputs.aws_region }}
          EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          FARGATE_DIGEST: ${{ steps.evidence.outputs.fargate_digest }}
          FARGATE_REPOSITORY: ${{ vars.AXON_FARGATE_ECR_REPOSITORY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          publish_target() {
            local archive=$1
            local digest=$2
            local repository=$3
            local repository_name=${repository#*.amazonaws.com/}
            local existing
            local lookup_error="${RUNNER_TEMP}/ecr-lookup-error"
            if existing=$(
              aws ecr describe-images \
                --region "${AWS_REGION}" \
                --repository-name "${repository_name}" \
                --image-ids "imageTag=${RELEASE_TAG}" \
                --query 'imageDetails[0].imageDigest' \
                --output text 2>"${lookup_error}"
            ); then
              [[ "${existing}" == "${digest}" ]]
              return
            fi
            if ! grep -q "ImageNotFoundException" "${lookup_error}"; then
              cat "${lookup_error}" >&2
              return 1
            fi
            oras cp \
              --from-oci-layout \
              --no-tty \
              "${archive}@${digest}" \
              "${repository}:${RELEASE_TAG}"
          }

          publish_target \
            "${EVIDENCE_DIR}/axonllm-linux-amd64.oci.tar" \
            "${FARGATE_DIGEST}" \
            "${FARGATE_REPOSITORY}"
          publish_target \
            "${EVIDENCE_DIR}/axonllm-agentcore-linux-arm64.oci.tar" \
            "${AGENTCORE_DIGEST}" \
            "${AGENTCORE_REPOSITORY}"

      - name: Verify remote image digests
        env:
          AGENTCORE_DIGEST: ${{ steps.evidence.outputs.agentcore_digest }}
          AGENTCORE_REPOSITORY: ${{ vars.AXON_AGENTCORE_ECR_REPOSITORY }}
          AWS_REGION: ${{ inputs.aws_region }}
          FARGATE_DIGEST: ${{ steps.evidence.outputs.fargate_digest }}
          FARGATE_REPOSITORY: ${{ vars.AXON_FARGATE_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          verify_target() {
            local repository=$1
            local digest=$2
            local image="${repository}@${digest}"
            python scripts/release/verify_ecr_image.py \
              "${image}" \
              --region "${AWS_REGION}" \
              --expected-digest "${digest}" \
              --verify-remote
          }
          verify_target \
            "${FARGATE_REPOSITORY}" "${FARGATE_DIGEST}"
          verify_target \
            "${AGENTCORE_REPOSITORY}" "${AGENTCORE_DIGEST}"

      - name: Emit immutable publication result
        id: result
        env:
          AGENTCORE_DIGEST: ${{ steps.evidence.outputs.agentcore_digest }}
          AGENTCORE_REPOSITORY: ${{ vars.AXON_AGENTCORE_ECR_REPOSITORY }}
          FARGATE_DIGEST: ${{ steps.evidence.outputs.fargate_digest }}
          FARGATE_REPOSITORY: ${{ vars.AXON_FARGATE_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          agentcore_image="${AGENTCORE_REPOSITORY}@${AGENTCORE_DIGEST}"
          fargate_image="${FARGATE_REPOSITORY}@${FARGATE_DIGEST}"
          {
            printf 'agentcore_image=%s\n' "${agentcore_image}"
            printf 'fargate_image=%s\n' "${fargate_image}"
          } >>"${GITHUB_OUTPUT}"
          {
            printf '### Immutable release images\n\n'
            printf -- '- AgentCore: \x60%s\x60\n' "${agentcore_image}"
            printf -- '- Fargate: \x60%s\x60\n' "${fargate_image}"
          } >>"${GITHUB_STEP_SUMMARY}"
