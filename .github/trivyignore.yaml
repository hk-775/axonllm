misconfigurations:
  - id: AVD-DS-0031
    paths:
      - Dockerfile
    statement: AXON_AUTH_MODE is a non-secret enforcement setting.
    expired_at: "2027-08-07T00:00:00Z"
  - id: AWS-0013
    paths:
      - AxonLLMControlPlaneStack.template.json
    statement: The AWS-managed cloudfront.net certificate does not permit a custom minimum viewer TLS policy; strict TLS 1.2 enforcement requires custom-domain mode.
    expired_at: "2027-08-13T00:00:00Z"
  - id: AWS-0132
    paths:
      - AxonLLMStack.template.json
      - AxonLLMControlPlaneStack.template.json
    statement: ALB and CloudFront access-log delivery require SSE-S3; the bucket cannot use a customer-managed KMS key.
    expired_at: "2027-08-07T00:00:00Z"
  - id: AWS-0095
    paths:
      - AxonLLMStack.template.json
      - AxonLLMAgentCoreStack.template.json
    statement: CloudWatch alarm delivery to an encrypted SNS topic requires a customer-managed KMS key; this facade profile intentionally forbids customer-managed runtime KMS keys, and the topic policy restricts publishing to same-account CloudWatch alarms.
    expired_at: "2027-08-18T00:00:00Z"
  - id: AWS-0096
    paths:
      - AxonLLMStack.template.json
      - AxonLLMAgentCoreStack.template.json
    statement: Trivy 0.72 does not recognize the CloudFormation SqsManagedSseEnabled property; synthesis tests require it to be true for both queues and forbid customer-managed queue keys.
    expired_at: "2027-02-18T00:00:00Z"
  - id: AWS-0035
    paths:
      - AxonLLMStack.template.json
      - AxonLLMControlPlaneStack.template.json
      - AxonLLMLaunchWorkersStack-managed.template.json
    statement: The task volume is ephemeral Fargate scratch storage mounted at /tmp; no EFSVolumeConfiguration exists, so EFS transit encryption does not apply.
    expired_at: "2027-08-07T00:00:00Z"
  - id: AWS-0036
    paths:
      - AxonLLMLaunchWorkersStack-managed.template.json
    statement: The environment value is an exact Secrets Manager ARN used to fetch credentials at runtime; secret material is never placed in the task environment.
    expired_at: "2027-08-12T00:00:00Z"
  - id: AWS-0053
    paths:
      - AxonLLMControlPlaneStack.template.json
    statement: The public control-plane ALB accepts HTTPS only from an approved managed prefix list and requires Cognito authentication.
    expired_at: "2027-08-11T00:00:00Z"
