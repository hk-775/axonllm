services:
  axonllm:
    build: .
    ports:
      # Host port is overridable because a clash here does not look like one.
      # Docker binds :: and a local `uv run python serve_dashboard.py` binds
      # 0.0.0.0, so both "succeed" — then localhost resolves to ::1 first and the
      # container silently answers for the gateway you started by hand. The
      # container port stays 8000 to match AXON_SERVER_PORT and the healthcheck.
      - "${AXON_HOST_PORT:-8000}:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - LLM_ROUTER_DYNAMODB_ENABLED=${LLM_ROUTER_DYNAMODB_ENABLED:-false}
      - AXON_DEPLOYMENT_PROFILE=${AXON_DEPLOYMENT_PROFILE:-development}
      - AXON_AUTH_MODE=${AXON_AUTH_MODE:-LOG_ONLY}
      - AXON_REQUIRE_CANONICAL_IDENTITY=${AXON_REQUIRE_CANONICAL_IDENTITY:-false}
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
