[project]
name = "axon-llm"
version = "0.2.4"
description = "AxonLLM — The neural control plane for enterprise LLMs"
requires-python = ">=3.11"
license = "MIT-0"
keywords = ["llm", "gateway", "ai", "routing", "enterprise", "bedrock", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "sqlglot>=27.0.0",
    "tiktoken>=0.7.0",
    "starlette>=0.37.0",
    "aiohttp>=3.9.0",
    "boto3>=1.28.0",
    "uvicorn[standard]>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/AxonLLM/axonllm"
Repository = "https://github.com/AxonLLM/axonllm"
Issues = "https://github.com/AxonLLM/axonllm/issues"
Documentation = "https://github.com/AxonLLM/axonllm#readme"

[project.optional-dependencies]
# Native OTLP span export (standalone observability). Opt-in at deploy time
# via OTEL_EXPORTER_OTLP_ENDPOINT; the exporter degrades to a no-op if absent.
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Enterprise identity: SAML SSO assertion verification. Pure-Python — signxml +
# lxml install from wheels (no libxml2/xmlsec1 system build). XXE/entity-expansion
# is blocked via lxml parser controls (no defusedxml needed).
saml = [
    "signxml>=3.2",
]
# OIDC JWT signature verification. Without it OIDCService logs an error and
# declines to verify rather than trusting an unverified token — safe, but it
# means SSO does not work, so this is required for any OIDC deployment.
oidc = [
    "httpx>=0.25.0",
    "python-jose[cryptography]>=3.3",
]
agentcore = [
    "bedrock-agentcore>=1.21.0,<2",
]
dev = [
    "hypothesis>=6.100.0",
    # Floor is deliberately low for library consumers; the pinned version CI and
    # local dev actually resolve to lives in uv.lock. Install with `uv sync`, not
    # bare pip, or you get this floor.
    "httpx>=0.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    # so CI exercises the OTLP span-mapping path
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    # so CI exercises SAML signature verification
    "signxml>=3.2",
    # so CI exercises OIDC JWT signature verification
    "python-jose[cryptography]>=3.3",
    # CI tooling is resolved through uv.lock rather than downloaded by uvx.
    "ruff==0.16.2",
]
security = [
    "pip-audit==2.10.1",
]

[project.scripts]
axon = "src.gateway.cli:main"
axon-demo = "src.gateway.cli:demo"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Put the repo root on sys.path so `import src.gateway...` resolves without
# relying on the CWD happening to be the repo root.
pythonpath = ["."]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

# The codebase imports everything as `src.gateway.*` (65 modules), so the
# installed package root is `src`. Package it explicitly rather than via
# find(where=["src"]) — the latter installs a top-level `gateway` that then
# fails on its own internal `from src.gateway...` imports when run out-of-tree.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
