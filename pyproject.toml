[project]
name = "axon-llm"
version = "0.1.0"
description = "AxonLLM — The neural control plane for enterprise LLMs"
requires-python = ">=3.11"
license = "MIT-0"
keywords = ["llm", "gateway", "ai", "routing", "enterprise", "bedrock", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "starlette>=0.37.0",
    "aiohttp>=3.9.0",
    "boto3>=1.28.0",
]

[project.urls]
Homepage = "https://github.com/axonllm/axonllm"
Repository = "https://github.com/axonllm/axonllm"
Issues = "https://github.com/axonllm/axonllm/issues"
Documentation = "https://github.com/axonllm/axonllm#readme"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "httpx>=0.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
