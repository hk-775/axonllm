<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>AxonLLM — Routing Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    :root {
      /* Colors - Cloudscape Palette */
      --color-bg: #f2f3f3;
      --color-bg-container: #ffffff;
      --color-bg-input: #ffffff;
      --color-bg-nav: #232f3e;
      --color-bg-nav-hover: #354150;
      --color-bg-status-info: #f2f8fd;
      --color-bg-status-success: #f2fcf3;
      --color-bg-status-error: #fff7f7;
      --color-bg-status-warning: #fffce9;
      --color-text-body: #000716;
      --color-text-heading: #000716;
      --color-text-secondary: #5f6b7a;
      --color-text-label: #000716;
      --color-text-nav: #d1d5db;
      --color-text-nav-active: #ffffff;
      --color-text-link: #0972d3;
      --color-border: #e9ebed;
      --color-border-input: #7d8998;
      --color-border-input-focus: #0972d3;
      --color-accent: #0972d3;
      --color-accent-hover: #033160;
      --color-status-success: #037f0c;
      --color-status-error: #d91515;
      --color-status-warning: #8d6605;
      --color-status-info: #0972d3;
      --color-brand-gradient-start: #ff9900;
      --color-brand-gradient-end: #ffb84d;

      /* Typography */
      --font-family: 'Open Sans', 'Amazon Ember', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-size-base: 14px;
      --font-size-heading-lg: 24px;
      --font-size-heading-md: 18px;
      --font-size-heading-sm: 16px;
      --font-size-label: 12px;
      --font-size-small: 13px;
      --line-height: 1.5;

      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 0.75rem;
      --space-lg: 1rem;
      --space-xl: 1.25rem;
      --space-2xl: 1.5rem;
      --space-3xl: 2rem;

      /* Border Radius */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;

      /* Layout */
      --sidebar-w: 220px;
      --topbar-h: 40px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--color-bg);
      color: var(--color-text-body);
      line-height: var(--line-height);
      font-size: var(--font-size-base);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--topbar-h);
      background: var(--color-bg-nav);
      display: flex; align-items: center;
      padding: 0 var(--space-lg);
    }
    .topbar-brand {
      display: flex; align-items: center; gap: var(--space-sm);
      color: #fff; font-size: var(--font-size-base); font-weight: 700;
      margin-right: var(--space-2xl);
      letter-spacing: -0.2px;
    }
    .topbar-brand .logo-icon {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--color-bg-nav);
    }
    .topbar-tagline {
      color: var(--color-brand-gradient-start);
      font-size: 13px;
      font-weight: 500;
      font-style: italic;
      letter-spacing: 0.3px;
      margin-right: var(--space-lg);
      white-space: nowrap;
      opacity: 1;
    }
    .topbar-nav {
      display: flex; align-items: center; height: 100%;
    }
    .topbar-nav a {
      color: var(--color-text-nav);
      text-decoration: none;
      font-size: var(--font-size-base); font-weight: 400;
      padding: 0 var(--space-md);
      height: var(--topbar-h);
      display: flex; align-items: center;
      border-left: 1px solid rgba(255,255,255,0.15);
      transition: background 100ms, color 100ms;
    }
    .topbar-nav a:hover {
      background: var(--color-bg-nav-hover);
      color: #fff;
    }
    .topbar-nav a.active {
      color: var(--color-text-nav-active);
      font-weight: 600;
      background: rgba(9,114,211,0.18);
    }
    .topbar-right {
      margin-left: auto;
      display: flex; align-items: center; gap: var(--space-md);
    }
    .topbar-status {
      display: flex; align-items: center; gap: 0.35rem;
      font-size: var(--font-size-label); color: var(--color-text-nav);
    }
    .topbar-status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #1aab2a;
    }

    /* ── Page Layout ── */
    .page-wrapper {
      max-width: 850px;
      margin: 0 auto;
      padding: var(--space-2xl) var(--space-lg);
      margin-top: var(--topbar-h);
    }

    /* ── Page Header ── */
    .page-header {
      margin-bottom: var(--space-xl);
    }
    .page-header h1 {
      font-size: var(--font-size-heading-lg);
      font-weight: 700;
      color: var(--color-text-heading);
    }
    .page-header p {
      color: var(--color-text-secondary);
      font-size: var(--font-size-base);
      margin-top: var(--space-xs);
    }

    /* ── Container / Card ── */
    .container {
      background: var(--color-bg-container);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-xl);
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,7,22,0.05);
    }
    .container-header {
      padding: 0.85rem var(--space-xl);
      border-bottom: 1px solid var(--color-border);
      font-size: var(--font-size-label);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-secondary);
    }
    .container-body {
      padding: var(--space-xl);
    }

    /* ── Form Controls ── */
    textarea {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: var(--color-bg-input);
      border: 2px solid var(--color-border-input);
      border-radius: 10px;
      color: var(--color-text-body);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      resize: vertical;
      min-height: 100px;
      outline: none;
      line-height: 1.6;
    }
    textarea:focus {
      border-color: var(--color-border-input-focus);
    }
    textarea:disabled {
      background: #f4f6f8;
      color: #9ba7b6;
      cursor: not-allowed;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.5rem 1.5rem;
      background: var(--color-accent);
      color: #fff;
      border: 2px solid var(--color-accent);
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: all 100ms;
      margin-top: var(--space-md);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--color-accent-hover);
      border-color: var(--color-accent-hover);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      font-size: var(--font-size-label);
      color: var(--color-text-secondary);
      margin-top: var(--space-sm);
    }

    /* ── Decision Grid ── */
    .decision {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .decision-box {
      border-radius: var(--radius-md);
      padding: 0.85rem;
    }
    .decision-box .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.3rem;
    }
    .decision-box .value {
      font-size: var(--font-size-heading-md);
      font-weight: 700;
      color: var(--color-text-heading);
    }
    .decision-box .sub {
      font-size: var(--font-size-label);
      color: var(--color-text-secondary);
      margin-top: var(--space-xs);
    }

    /* Decision box color variants - Cloudscape status colors */
    .box-blue {
      background: var(--color-bg-status-info);
      border: 1px solid #d3e7f9;
    }
    .box-blue .label { color: var(--color-status-info); }

    .box-orange {
      background: var(--color-bg-status-warning);
      border: 1px solid #fde68a;
    }
    .box-orange .label { color: var(--color-status-warning); }

    .box-green {
      background: var(--color-bg-status-success);
      border: 1px solid #c6f0c8;
    }
    .box-green .label { color: var(--color-status-success); }

    /* ── Reason Card ── */
    .reason-card {
      background: var(--color-bg-status-success);
      border: 1px solid #c6f0c8;
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .reason-card .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-status-success);
      margin-bottom: 0.35rem;
    }
    .reason-card .text {
      font-size: var(--font-size-base);
      line-height: 1.6;
      color: var(--color-text-body);
    }

    /* ── Response Text ── */
    .response-text {
      background: #fafafa;
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      font-size: var(--font-size-base);
      border: 1px solid var(--color-border);
    }

    /* ── Stats Row ── */
    .stats {
      display: flex;
      gap: var(--space-2xl);
      margin-top: var(--space-md);
      font-size: var(--font-size-label);
      color: var(--color-text-secondary);
    }

    /* ── Error Box ── */
    .error-box {
      background: var(--color-bg-status-error);
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      color: var(--color-status-error);
      margin-bottom: var(--space-lg);
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Smart Routing Decision ── */
    .smart-routing-card {
      background: var(--color-bg-status-info);
      border: 1px solid #d3e7f9;
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .smart-routing-card .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-status-info);
      margin-bottom: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .smart-routing-card .sr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }
    .smart-routing-card .sr-item .sr-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .smart-routing-card .sr-item .sr-value {
      font-size: var(--font-size-heading-sm);
      font-weight: 700;
      color: var(--color-text-heading);
      margin-top: 2px;
    }
    .sr-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-label);
      font-weight: 600;
      background: var(--color-accent);
      color: #fff;
    }
    .sr-badge-fallback {
      background: var(--color-status-warning);
      color: #fff;
    }
    .sr-candidates {
      margin-top: var(--space-sm);
    }
    .sr-candidates .sr-candidate {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 4px 0;
      font-size: var(--font-size-small);
      border-bottom: 1px solid var(--color-border);
    }
    .sr-candidates .sr-candidate:last-child {
      border-bottom: none;
    }
    .sr-candidate-selected {
      font-weight: 700;
      color: var(--color-status-info);
    }
    .sr-candidate-filtered {
      color: var(--color-text-secondary);
      text-decoration: line-through;
    }

    /* ── Mode Selector ── */
    .mode-selector {
      display: flex;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }
    .mode-btn {
      padding: 0.4rem 0.85rem;
      background: var(--color-bg-container);
      border: 2px solid var(--color-border-input);
      border-radius: var(--radius-md);
      font-size: var(--font-size-small);
      font-weight: 600;
      font-family: var(--font-family);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 100ms;
    }
    .mode-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .mode-btn.active {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
    }

    /* ── Ensemble Decision ── */
    .ensemble-card {
      background: #f7f4fd;
      border: 1px solid #ddd0f5;
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .ensemble-card .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6928c4;
      margin-bottom: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .ensemble-card .en-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }
    .ensemble-card .en-item .en-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .ensemble-card .en-item .en-value {
      font-size: var(--font-size-heading-sm);
      font-weight: 700;
      color: var(--color-text-heading);
      margin-top: 2px;
    }
    .en-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: var(--font-size-label);
      font-weight: 700;
    }
    .en-pill-met {
      background: var(--color-bg-status-success);
      color: var(--color-status-success);
      border: 1px solid #c6f0c8;
    }
    .en-pill-unmet {
      background: var(--color-bg-status-error);
      color: var(--color-status-error);
      border: 1px solid #fecaca;
    }
    .en-badge-fallback {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-label);
      font-weight: 600;
      background: var(--color-status-warning);
      color: #fff;
    }
    .en-members {
      margin-top: var(--space-sm);
    }
    .en-members .en-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }
    .en-member {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 5px 0;
      font-size: var(--font-size-small);
      border-bottom: 1px solid var(--color-border);
    }
    .en-member:last-child {
      border-bottom: none;
    }
    .en-member-status {
      font-weight: 700;
      width: 16px;
      flex-shrink: 0;
    }
    .en-member-ok .en-member-status { color: var(--color-status-success); }
    .en-member-fail { color: var(--color-text-secondary); }
    .en-member-fail .en-member-status { color: var(--color-status-error); }
    .en-member-reason {
      color: var(--color-status-error);
      font-size: var(--font-size-label);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function RoutingExplorer() {
      const [models, setModels] = useState([]);
      const [prompt, setPrompt] = useState('');
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [mode, setMode] = useState('smart');

      useEffect(() => { fetch('/api/models').then(r => r.json()).then(setModels).catch(() => {}); }, []);

      const handleSend = async () => {
        if (!prompt.trim() || loading || models.length === 0) return;
        setLoading(true); setResult(null);

        const startTime = Date.now();

        try {
          // Send with smart_routing context flag — let the router pick the model
          const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(
              mode === 'smart'
                ? {
                    model: '',
                    messages: [{ role: 'user', content: prompt.trim() }],
                    context: { smart_routing: true },
                  }
                : {
                    model: mode, // "ensemble:budget" or "ensemble:quality"
                    messages: [{ role: 'user', content: prompt.trim() }],
                  }
            ),
          });
          const data = await resp.json();
          const latency = Date.now() - startTime;

          if (data.error) {
            setResult({ error: data.error.message || JSON.stringify(data.error), latency });
          } else {
            const usedProvider = data.provider || 'unknown';
            const usedModel = data.model || 'unknown';
            const smartRouting = data.smart_routing || null;
            const ensemble = data.ensemble || null;

            // Build model selection reason
            let modelReason = '';
            let providerReason = '';

            if (smartRouting) {
              modelReason = `Smart routing classified your prompt as "${smartRouting.task_type}" (confidence: ${Math.round(smartRouting.confidence * 100)}%) and selected "${smartRouting.selected_model}" with benchmark score ${smartRouting.benchmark_score}.`;
              if (smartRouting.used_fallback) {
                modelReason += ' ⚠️ Confidence was below threshold — used fallback model.';
              }
              providerReason = `Provider "${usedProvider}" was selected for model "${usedModel}" using health-aware routing.`;
            } else if (ensemble) {
              modelReason = `Ensemble routing dispatched your prompt to a panel of ${ensemble.panel.length} models (${ensemble.panel.join(', ')}) and "${ensemble.judge}" synthesized the ${ensemble.succeeded_count} surviving response(s) into one answer.`;
              providerReason = `Panel members ran concurrently; the judge model "${ensemble.judge}" produced the final synthesis. Estimated cost ≈ ${ensemble.cost_multiplier}× a single call.`;
            } else {
              modelReason = `The router selected "${usedModel}" from available models.`;
              providerReason = `Provider "${usedProvider}" was selected.`;
            }

            setResult({
              content: data.content,
              provider: usedProvider,
              providerModelId: usedModel,
              virtualModel: smartRouting ? smartRouting.selected_model : (ensemble ? ensemble.judge : usedModel),
              strategy: smartRouting ? 'smart' : (ensemble ? `ensemble (${ensemble.preset})` : 'unknown'),
              modelReason,
              providerReason,
              availableProviders: [],
              usage: data.usage || {},
              latency,
              smartRouting,
              ensemble,
            });
          }
        } catch (err) {
          setResult({ error: 'Connection error: ' + err.message, latency: Date.now() - startTime });
        }
        setLoading(false);
      };

      return (
        <div>
          <header className="topbar" role="banner">
            <div className="topbar-brand">
              <div className="logo-icon">R</div>
              AxonLLM
            </div>
            <div className="topbar-tagline">The neural control plane for enterprise LLMs</div>
            <nav className="topbar-nav">
              <a href="/admin/dashboard">Dashboard</a>
              <a href="/chat">Chat</a>
              <a href="/playground">Playground</a>
              <a href="/routing" className="active">Routing</a>
            </nav>
            <div className="topbar-right">
              <div className="topbar-status"><div className="dot"></div>System Online</div>
            </div>
          </header>

          <div className="page-wrapper">
            <div className="page-header">
              <h1>🔀 Routing Explorer</h1>
              <p>Just type a prompt. AxonLLM picks the model and provider automatically, then shows you exactly what it chose and why.</p>
            </div>

            <div className="container">
              <div className="container-header">Your Prompt</div>
              <div className="container-body">
                <div className="mode-selector" role="radiogroup" aria-label="Routing mode">
                  <button
                    className={`mode-btn ${mode === 'smart' ? 'active' : ''}`}
                    onClick={() => setMode('smart')}
                    type="button"
                  >🧠 Smart</button>
                  <button
                    className={`mode-btn ${mode === 'ensemble:budget' ? 'active' : ''}`}
                    onClick={() => setMode('ensemble:budget')}
                    type="button"
                  >🤝 Ensemble · Budget</button>
                  <button
                    className={`mode-btn ${mode === 'ensemble:quality' ? 'active' : ''}`}
                    onClick={() => setMode('ensemble:quality')}
                    type="button"
                  >🤝 Ensemble · Quality</button>
                </div>
                <textarea
                  placeholder="Type anything... The router will pick the best model and provider for you."
                  value={prompt}
                  onChange={e => setPrompt(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleSend(); }}
                  aria-label="Prompt input"
                />
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div className="hint">
                    {mode === 'smart'
                      ? 'Cmd+Enter to send. Smart routing classifies your prompt and selects the best single model.'
                      : 'Cmd+Enter to send. Ensemble routing fans out to a panel of models, then a judge synthesizes one answer (~N+1× cost).'}
                  </div>
                  <button className="btn-primary" onClick={handleSend} disabled={loading || !prompt.trim() || models.length === 0}>
                    {loading ? <><span className="spinner"></span>Routing...</> : '🔀 Route & Send'}
                  </button>
                </div>
              </div>
            </div>

            {result && !result.error && (
              <div>
                {result.smartRouting && (
                  <div className="smart-routing-card">
                    <div className="card-title">
                      🧠 Smart Routing Decision
                      {result.smartRouting.used_fallback && (
                        <span className="sr-badge sr-badge-fallback">⚠️ Fallback</span>
                      )}
                    </div>
                    <div className="sr-grid">
                      <div className="sr-item">
                        <div className="sr-label">Task Type</div>
                        <div className="sr-value"><span className="sr-badge">{result.smartRouting.task_type}</span></div>
                      </div>
                      <div className="sr-item">
                        <div className="sr-label">Confidence</div>
                        <div className="sr-value">{Math.round(result.smartRouting.confidence * 100)}%</div>
                      </div>
                      <div className="sr-item">
                        <div className="sr-label">Benchmark Score</div>
                        <div className="sr-value">{result.smartRouting.benchmark_score}</div>
                      </div>
                    </div>
                    {result.smartRouting.candidates && result.smartRouting.candidates.length > 0 && (
                      <div className="sr-candidates">
                        <div className="sr-label" style={{marginBottom:'4px'}}>Candidates Considered</div>
                        {result.smartRouting.candidates.map((c, i) => (
                          <div key={i} className={`sr-candidate ${c.model === result.smartRouting.selected_model ? 'sr-candidate-selected' : ''} ${c.filtered_reason ? 'sr-candidate-filtered' : ''}`}>
                            <span>{i + 1}.</span>
                            <span>{c.model}</span>
                            <span>— {c.benchmark_score} pts</span>
                            {c.model === result.smartRouting.selected_model && <span>✓ selected</span>}
                            {c.filtered_reason && <span>({c.filtered_reason})</span>}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {result.ensemble && (
                  <div className="ensemble-card">
                    <div className="card-title">
                      🤝 Ensemble Decision
                      <span className={`en-pill ${result.ensemble.quorum_met ? 'en-pill-met' : 'en-pill-unmet'}`}>
                        {result.ensemble.quorum_met ? 'Quorum met' : 'Quorum not met'} ({result.ensemble.succeeded_count}/{result.ensemble.quorum_threshold})
                      </span>
                      {result.ensemble.fallback_used && (
                        <span className="en-badge-fallback">⚠️ Fallback used</span>
                      )}
                    </div>
                    <div className="en-grid">
                      <div className="en-item">
                        <div className="en-label">Preset</div>
                        <div className="en-value">{result.ensemble.preset}</div>
                      </div>
                      <div className="en-item">
                        <div className="en-label">Judge Model</div>
                        <div className="en-value">{result.ensemble.judge}</div>
                      </div>
                      <div className="en-item">
                        <div className="en-label">Cost Multiplier</div>
                        <div className="en-value">{result.ensemble.cost_multiplier}× (panel + judge)</div>
                      </div>
                    </div>
                    <div className="en-members">
                      <div className="en-label">Panel Models Used</div>
                      {(result.ensemble.panel || []).map((m, i) => {
                        const failedEntry = (result.ensemble.failed || []).find(f => f.model === m);
                        const succeeded = (result.ensemble.succeeded || []).indexOf(m) !== -1 && !failedEntry;
                        return (
                          <div key={i} className={`en-member ${succeeded ? 'en-member-ok' : 'en-member-fail'}`}>
                            <span className="en-member-status">{succeeded ? '✓' : '✗'}</span>
                            <span>{i + 1}. {m}</span>
                            {succeeded
                              ? <span className="en-member-note">— responded</span>
                              : (failedEntry && failedEntry.reason && <span className="en-member-reason">— {failedEntry.reason}</span>)}
                          </div>
                        );
                      })}
                      <div className="en-judge-row">
                        <span className="en-judge-arrow">⮕</span>
                        <span className="en-judge-label">Synthesized by judge:</span>
                        <span className="en-judge-model">{result.ensemble.judge}</span>
                      </div>
                    </div>
                  </div>
                )}

                <div className="decision">
                  <div className="decision-box box-blue">
                    <div className="label">Model Selected</div>
                    <div className="value">{result.virtualModel}</div>
                    <div className="sub">Provider model: {result.providerModelId}</div>
                  </div>
                  <div className="decision-box box-blue">
                    <div className="label">Provider Selected</div>
                    <div className="value">{result.provider}</div>
                    <div className="sub">{result.availableProviders.length > 0 ? `Available: ${result.availableProviders.join(', ')}` : 'Health-aware selection'}</div>
                  </div>
                </div>

                <div className="decision">
                  <div className="decision-box box-orange">
                    <div className="label">Routing Strategy</div>
                    <div className="value">{result.strategy}</div>
                  </div>
                  <div className="decision-box box-green">
                    <div className="label">Latency</div>
                    <div className="value">{result.latency}ms</div>
                    <div className="sub">{result.usage.total_tokens || '?'} tokens used</div>
                  </div>
                </div>

                <div className="reason-card">
                  <div className="label">🧠 Why This Model + Provider?</div>
                  <div className="text">{result.modelReason}<br/><br/>{result.providerReason}</div>
                </div>

                <div className="container">
                  <div className="container-header">Response from {result.provider} / {result.virtualModel}</div>
                  <div className="container-body">
                    <div className="response-text">{result.content}</div>
                    <div className="stats">
                      <span>📥 {result.usage.prompt_tokens || '?'} prompt tokens</span>
                      <span>📤 {result.usage.completion_tokens || '?'} completion tokens</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {result && result.error && (
              <div className="error-box">
                <strong>Error:</strong> {result.error}
                <div className="stats"><span>⏱ {result.latency}ms</span></div>
              </div>
            )}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<RoutingExplorer />);
  </script>
</body>
</html>
