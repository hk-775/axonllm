services:
  axonllm:
    image: "${AXON_STANDALONE_IMAGE:?set an exact image@sha256 reference}"
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AXON_AUTH_MODE: ENFORCE
      AXON_DEPLOYMENT_PROFILE: production
      AXON_DYNAMODB_TABLE: "${AXON_DYNAMODB_TABLE:?set the existing state table}"
      AXON_ENABLED_PROVIDERS: "${AXON_ENABLED_PROVIDERS:?name the enabled providers}"
      AXON_LOAD_DEMO_DATA: "false"
      AXON_NO_BROWSER: "true"
      AXON_OIDC_AUDIENCE: "${AXON_OIDC_AUDIENCE:?set the OIDC audience}"
      AXON_OIDC_ISSUER: "${AXON_OIDC_ISSUER:?set the HTTPS OIDC issuer}"
      AXON_REQUIRE_CANONICAL_IDENTITY: "true"
      AXON_ROUTING_CONFIG_SIGNING_KEY_ARN: "${AXON_ROUTING_CONFIG_SIGNING_KEY_ARN:?set the routing-signing KMS key ARN}"
      AXON_ROUTING_CONFIG_SIGNING_MODE: sign-verify
      AXON_SERVER_HOST: 0.0.0.0
      AXON_SERVER_PORT: "8000"
      LLM_ROUTER_DYNAMODB_ENABLED: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - customer

networks:
  customer:
    external: true
    name: "${AXON_DOCKER_NETWORK:?set an existing Docker network}"
